apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-demo-wizard
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-demo-wizard-https
      namespace: agentgateway-system
  hostnames:
    - example.com
  rules:
    - backendRefs:
        - name: agentgateway-demo-wizard
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
