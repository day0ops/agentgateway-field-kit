apiVersion: agentgateway.demo/v1
kind: Profile
metadata:
  name: local-single-cluster-with-solo-ui
  description: |
    Single bring-your-own Kubernetes cluster
    - Solo UI and full observability
    - Keycloak OIDC login
spec:
  environment: local

  agentgateway:
    version: v2026.10.2
    ociRegistry: oci://us-docker.pkg.dev/solo-public/enterprise-agentgateway/charts

  agentgateway-crds:
    version: v2026.10.2
    ociRegistry: oci://us-docker.pkg.dev/solo-public/enterprise-agentgateway/charts
    helmValues:
      installAgentgatewayModelCRD: true

  gatewayApi:
    version: v1.6.3
    channel: experimental

  ui:
    enabled: true
    hostname: '{{env.domains.core.agentgatewayUi}}'
    tls:
      enabled: true
    oidc:
      enabled: true
      issuerUrl: 'https://{{env.domains.core.keycloak}}/realms/solo-ui'
      backendClientSecret: solo-ui-backend-secret

  addons:
    - name: cert-manager
      description: Certificate management for TLS
      version: '{{env.addons.cert-manager.version}}'
      namespace: cert-manager
      config:
        letsencrypt:
          enabled: true
          provider: cloudflare
          email: '{{env.acme.email}}'

    - name: external-dns
      description: Automatic DNS record management via Cloudflare
      version: '{{env.addons.external-dns.version}}'
      namespace: external-dns
      config:
        provider: cloudflare
        domainFilter: '{{env.dns.parentZone.domain}}'
        txtOwnerId: '{{env.dns.txtOwnerId}}'
        proxied: false

    - name: keycloak
      description: Keycloak OIDC provider for Solo UI login
      phase: post
      namespace: keycloak
      config:
        hostname: '{{env.domains.core.keycloak}}'
        protocol: '{{env.keycloak.scheme}}'
        loginTheme: '{{env.keycloak.loginTheme}}'
        tls:
          enabled: true
          secretName: keycloak-tls
          createCertificate: true
        soloUiClients:
          enabled: true
          realm: solo-ui
          hostname: 'https://{{env.domains.core.agentgatewayUi}}'
          backendClientId: enterprise-agentgateway-ui-backend
          backendClientSecret: solo-ui-backend-secret
          frontendClientId: enterprise-agentgateway-ui

    - name: telemetry
      description: OpenTelemetry observability stack (Prometheus, Grafana, Loki, Tempo)
      namespace: telemetry
      chartVersions: '{{env.addons.telemetry}}'
      config:
        grafanaHostname: '{{env.domains.core.grafana}}'
