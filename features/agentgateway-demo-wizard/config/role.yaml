apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentgateway-demo-wizard
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: agentgateway-demo-wizard
rules:
  - apiGroups: ['gateway.networking.k8s.io']
    resources: ['gateways', 'httproutes']
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
  - apiGroups: ['enterpriseagentgateway.solo.io']
    resources:
      - enterpriseagentgatewaybackends
      - enterpriseagentgatewaypolicies
      - enterpriseagentgatewayparameters
      - enterpriseagentgatewaybudgets
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
  - apiGroups: ['ratelimit.solo.io']
    resources: ['ratelimitconfigs']
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
  - apiGroups: ['']
    resources: ['configmaps', 'secrets', 'services', 'serviceaccounts']
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
