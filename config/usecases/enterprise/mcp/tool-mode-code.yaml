apiVersion: agentgateway.demo/v1
kind: UseCase
metadata:
  name: tool-mode-code
  description: |
    Collapses a large MCP tool catalog into a single run_code tool that executes code against it, instead of listing every tool individually - cutting context usage for agents.
  docs: https://docs.solo.io/agentgateway/2026.7.1/mcp/tool-mode/

spec:
  diagram: |
    sequenceDiagram
      participant Agent
      participant AGW as agentgateway (toolMode: Code)
      participant Stock as Stock MCP Server
      participant Currency as Currency MCP Server
      Agent->>AGW: MCP tools/list
      AGW-->>Agent: single tool: run_code
      Agent->>AGW: MCP tools/call run_code (JS calling stock + currency tools)
      AGW->>Stock: invoke get_stock_price
      AGW->>Currency: invoke get_exchange_rate
      Stock-->>AGW: result
      Currency-->>AGW: result
      AGW-->>Agent: run_code result
  steps:
    - title: Deploy the stock and currency MCP server workloads
      description: |
        Deploy both MCP server workloads. This step's own AgentgatewayBackend/HTTPRoute are not used by this demo - the entMcp backend below federates the same underlying Services via label selectors.
      features:
        - name: mcp-server
          config:
            backendName: mcp-workloads-backend
            routeName: mcp-workloads
            protocol: StreamableHTTP
            mcpPath: /mcp
            servers:
              - name: stock-server-mcp
                image: '{{env.images.stock-server-mcp}}'
                serverPort: 8000
                servicePort: 80
              - name: currency-server-mcp
                image: '{{env.images.currency-server-mcp}}'
                serverPort: 8000
                servicePort: 80
            targets:
              - name: stock-server-mcp
                matchLabels:
                  app: stock-server-mcp
              - name: currency-server-mcp
                matchLabels:
                  app: currency-server-mcp

    - title: Federate with toolMode Code
      description: |
        Create an EnterpriseAgentgatewayBackend federating both servers with toolMode: Code, collapsing the tool catalog into a single run_code tool.
      features:
        - name: mcp-enterprise
          config:
            backendName: mcp-code-backend
            routeName: mcp-code
            pathPrefix: /mcp-code
            toolMode: Code
            codeMode:
              timeout: 7s
            targets:
              - name: stock-server-mcp
                matchLabels:
                  app: stock-server-mcp
              - name: currency-server-mcp
                matchLabels:
                  app: currency-server-mcp

  tests:
    - name: test-single-run-code-tool
      description: toolMode Code collapses the federated catalog into one run_code tool
      steps:
        - action: send-mcp-request
          endpoint: /mcp-code
          method: tools/list
        - action: verify
          expect:
            status: success
            contains: run_code
