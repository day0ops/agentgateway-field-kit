apiVersion: agentgateway.demo/v1
kind: Walkthrough
metadata:
  name: llm-gateway-routing
  description: |
    A tour of agentgateway's LLM-routing intelligence across real providers.
    - direct multi-model selection
    - wildcard model serving
    - model aliasing
    - body-based routing
    - load balancing with resilient retries
    - weighted virtual models
    - conditional virtual models
    - automatic failover
    - AI-driven tier routing via a hosted decision model

    Requires a profile with the cert-manager addon installed (e.g. `local-single-cluster`).

spec:
  environment: local
  preProvision:
    - name: certificate
      config:
        name: models-gateway-tls
        secretName: models-gateway-tls
        issuer: '{{env.tls.issuer}}'
        dnsNames: [models-gateway.test]
    - name: gateway
      config:
        name: models-gateway
        listeners:
          - name: https
            port: 443
            protocol: HTTPS
            hostname: models-gateway.test
            tls: { mode: Terminate, certificateRefs: [{ name: models-gateway-tls }] }
            allowedRoutes:
              namespaces:
                from: All
              kinds:
                - group: gateway.networking.k8s.io
                  kind: HTTPRoute
                - group: agentgateway.dev
                  kind: AgentgatewayModel
  screens:
    - name: multi-model-routing
      title: Multi-Model Routing
      narration: |
        One gateway, multiple providers. The client picks the model directly - agentgateway routes each request to the right provider with no extra configuration per request.
      setup:
        - name: agentgateway-model
          config:
            sectionName: https
            models:
              - name: gpt-4o-mini
                provider: openai
              - name: claude-sonnet-5
                provider: anthropic
      steps:
        - kind: http
          label: 'POST /v1/chat/completions (gpt-4o-mini)'
          method: POST
          url: 'https://models-gateway.test/v1/chat/completions'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /v1/chat/completions (claude-sonnet-5)'
          method: POST
          url: 'https://models-gateway.test/v1/chat/completions'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "claude-sonnet-5", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200

    - name: wildcard-model-serving
      title: Wildcard Model Serving
      narration: |
        A single AgentgatewayModel can serve a whole family of names - a wildcard match of openai/* accepts any client-facing model that starts with that prefix, and a transformation strips the prefix before the request reaches the provider.
      setup:
        - name: agentgateway-model
          config:
            sectionName: https
            models:
              - name: openai-models
                match: 'openai/*'
                provider: openai
                visibility: Public
                transformations:
                  - field: model
                    expression: 'llmRequest.model.stripPrefix("openai/")'
      steps:
        - kind: http
          label: 'POST /v1/chat/completions (openai/gpt-4o-mini, wildcard-matched)'
          method: POST
          url: 'https://models-gateway.test/v1/chat/completions'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "openai/gpt-4o-mini", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200

    - name: model-aliasing
      title: Model Aliasing
      narration: |
        Friendly alias names stand in for real model identifiers - the client sends "fast" or "smart" and agentgateway resolves it to the actual model before forwarding, so the underlying model can change without any client code change. This same alias set also defines "cheap" and "premium" tiers, used later by the Jev screen.
      setup:
        - name: model-aliasing
          config:
            provider: openai
            pathPrefix: /alias
            aliases:
              fast: gpt-4o-mini
              smart: gpt-4o
              code: o3-mini
              cheap: gpt-4o-mini
              premium: gpt-4o
      steps:
        - kind: http
          label: 'POST /alias (fast, resolves to gpt-4o-mini)'
          method: POST
          url: 'https://models-gateway.test/alias'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "fast", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /alias (smart, resolves to gpt-4o)'
          method: POST
          url: 'https://models-gateway.test/alias'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "smart", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200

    - name: body-based-routing
      title: Body-Based Routing
      narration: |
        A single /chat endpoint routes to different providers based on the model field in the request body - the client never needs to know which provider is behind which model.
      setup:
        - name: providers
          config:
            pathPrefix: /chat
            bodyRouting: true
            providers:
              - name: openai
                providerName: openai
                model: 'gpt-.*'
                modelMatch: RegularExpression
              - name: vertex-ai
                providerName: vertex-ai
                model: 'google/gemini-.*'
                modelMatch: RegularExpression
      steps:
        - kind: http
          label: 'POST /chat (gpt-4o-mini, body-matched to OpenAI)'
          method: POST
          url: 'https://models-gateway.test/chat'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /chat (gemini-2.5-flash, body-matched to Vertex AI)'
          method: POST
          url: 'https://models-gateway.test/chat'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "google/gemini-2.5-flash", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200

    - name: load-balancing
      title: Load Balancing (Power of Two Choices)
      narration: |
        Same traffic, no single model - requests spread across three providers automatically, picking whichever of two randomly-sampled backends looks less loaded. The third provider is deliberately misconfigured with a model that doesn't exist, simulating a misbehaving provider - every request routed to it fails. A retry policy configures resilience here, retrying on the specific failure signal this demo's broken provider returns, so every client request still succeeds despite a consistently failing backend in the mix.
      setup:
        - name: load-balancing
          config:
            pathPrefix: /model
            providers:
              - name: openai
                model: gpt-4o-mini
              - name: vertex-ai
                model: google/gemini-2.5-flash
                location: us-east5
              - name: anthropic
                model: claude-does-not-exist
        - name: traffic-policy
          config:
            targetRef:
              name: load-balancing
              kind: HTTPRoute
            retry:
              attempts: 20
              backoff: 25ms
              codes: [404]
      steps:
        - kind: traffic-split
          label: '20 requests - only the two working providers ever show up in the tally'
          method: POST
          url: 'https://models-gateway.test/model'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"messages": [{"role": "user", "content": "What is 2+2?"}]}'
          requestCount: 20
          tallyBy: model
        - kind: traffic-split
          label: 'Same 20 requests, tallied by status - the retry policy keeps every one at 200'
          method: POST
          url: 'https://models-gateway.test/model'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"messages": [{"role": "user", "content": "What is 2+2?"}]}'
          requestCount: 20
          tallyBy: '$status'

    - name: weighted-virtual-model
      title: Weighted Virtual Model
      narration: |
        The client only ever sees "balanced" - behind it, a virtual model splits traffic 80/20 across two concrete targets, and neither target is directly requestable. A single request can't show a weighted split, so this runs 20 and tallies which target served each one. Real customer interest in weighted routing usually comes with a session-affinity caveat - a user's follow-up requests landing on a different target than their first - which this demo doesn't cover.
      setup:
        - name: agentgateway-model
          config:
            sectionName: https
            models:
              - name: internal-fast
                provider: openai
                visibility: Internal
                transformations:
                  - field: model
                    expression: '"gpt-4o-mini"'
              - name: internal-premium
                provider: openai
                visibility: Internal
                transformations:
                  - field: model
                    expression: '"gpt-4o"'
              - name: balanced
                virtualModel:
                  weighted:
                    targets:
                      - name: internal-fast
                        weight: 80
                      - name: internal-premium
                        weight: 20
      steps:
        - kind: traffic-split
          label: '20 requests to balanced, tallied by which target served each one'
          method: POST
          url: 'https://models-gateway.test/v1/chat/completions'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "balanced", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          requestCount: 20
          tallyBy: model

    - name: conditional-virtual-model
      title: Conditional Virtual Model
      narration: |
        Same idea as the weighted screen, but the choice of target isn't a fixed percentage - it's decided by a signal on the request itself. The client only ever sees "tiered" - behind it, a virtual model inspects the x-model-tier header and routes to the premium target when it's set to "premium", falling back to the fast target for everything else.
      setup:
        - name: agentgateway-model
          config:
            sectionName: https
            models:
              - name: internal-fast
                provider: openai
                visibility: Internal
                transformations:
                  - field: model
                    expression: '"gpt-4o-mini"'
              - name: internal-premium
                provider: openai
                visibility: Internal
                transformations:
                  - field: model
                    expression: '"gpt-4o"'
              - name: tiered
                virtualModel:
                  conditional:
                    targets:
                      - when: 'request.headers["x-model-tier"] == "premium"'
                        name: internal-premium
                      - name: internal-fast
      steps:
        - kind: http
          label: 'POST /v1/chat/completions (tiered, x-model-tier: premium)'
          method: POST
          url: 'https://models-gateway.test/v1/chat/completions'
          resolveGateway: { name: models-gateway }
          insecure: true
          headers:
            x-model-tier: premium
          body: '{"model": "tiered", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /v1/chat/completions (tiered, no header, falls back)'
          method: POST
          url: 'https://models-gateway.test/v1/chat/completions'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "tiered", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200

    - name: automatic-failover
      title: Automatic Failover
      narration: |
        A virtual model with a priority list - the first request is served by the primary provider; once it's marked unhealthy, the next request fails over to a different provider automatically.
      setup:
        - name: agentgateway-model
          config:
            sectionName: https
            models:
              - name: internal-openai-primary
                provider: openai
                visibility: Internal
                transformations:
                  - field: model
                    expression: '"gpt-4o"'
                health:
                  unhealthyCondition: 'true'
                  eviction:
                    consecutiveFailures: 1
              - name: internal-anthropic-fallback
                provider: anthropic
                visibility: Internal
                transformations:
                  - field: model
                    expression: '"claude-sonnet-5"'
              - name: resilient-chat
                virtualModel:
                  failover:
                    targets:
                      - name: internal-openai-primary
                        priority: 0
                      - name: internal-anthropic-fallback
                        priority: 1
      steps:
        - kind: http
          label: 'First request - served by the OpenAI primary'
          method: POST
          url: 'https://models-gateway.test/v1/chat/completions'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "resilient-chat", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200
        - kind: http
          label: 'Second request - primary now evicted, fails over to Anthropic'
          method: POST
          url: 'https://models-gateway.test/v1/chat/completions'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "resilient-chat", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200

    - name: jev-decision-routing
      title: 'Jev: AI Decides the Tier'
      narration: |
        Jev, TypeSafe's hosted decision model, classifies the prompt as cheap or premium - a presenter would normally route the next request to that tier. Both calls go through the gateway, so the same auth, cost-tracking, and rate-limit policies apply to the classification call too, not just the completion.
      setup:
        - name: providers
          config:
            providers:
              - name: jev
                providerName: typesafe
                pathPrefix: /jev
                policies:
                  ai:
                    routes:
                      '*': Passthrough
      steps:
        - kind: http
          label: 'POST /jev - classify the prompt'
          method: POST
          url: 'https://models-gateway.test/jev'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: >-
            {"model": "jev-latest", "state": "Say hello", "questions": {"tier":
            {"type": "choice", "instructions": "Does this request need a premium
            (complex reasoning) or cheap (simple, routine) model to answer well?",
            "criteria": {"cheap": "Simple, routine request any capable model can
            answer well", "premium": "Complex request needing deeper reasoning or
            higher quality output"}}}}
          expectStatus: 200
        - kind: http
          label: 'POST /alias with the tier Jev picked (cheap)'
          method: POST
          url: 'https://models-gateway.test/alias'
          resolveGateway: { name: models-gateway }
          insecure: true
          body: '{"model": "cheap", "messages": [{"role": "user", "content": "Say hello"}]}'
          expectStatus: 200
