apiVersion: agentgateway.demo/v1
kind: Profile
metadata:
  name: eks-enterprise-agentgateway-minimal
  description: |
    Minimal enterprise agentgateway (bleeding edge version) demo on EKS
    - Keycloak integration
    - TLS via cert-manager, and DNS via Route53
spec:
  environment: aws-dev
  infra: eks-single-cluster

  agentgateway:
    version: v2026.9.3
    ociRegistry: oci://us-docker.pkg.dev/solo-public/enterprise-agentgateway/charts

  agentgateway-crds:
    version: v2026.9.3
    ociRegistry: oci://us-docker.pkg.dev/solo-public/enterprise-agentgateway/charts
    helmValues:
      installAgentgatewayModelCRD: true

  gatewayApi:
    version: v1.6.3
    channel: experimental

  helmValues:
    controller:
      extraEnv:
        KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: 'true'
    budgetDimensions:
      config:
        hierarchy:
          - id: org_id
            expression: jwt.org_id
            displayName: Organization
          - id: team_id
            expression: jwt.team_id
            displayName: Team
          - id: group
            expression: coalesce(jwt.group, apiKey.group)
            displayName: Group
          - id: user
            expression: 'coalesce(apiKey.user, apiKey.name, apiKey.owner, jwt.sub, jwt.email, basicAuth.username, source.identity.namespace + "/" + source.identity.serviceAccount, source.subjectCn)'
            displayName: User
        attributes:
          - id: username
            expression: jwt.preferred_username
            displayName: Username
          - id: virtualKey
            expression: apiKey.id
            displayName: Virtual Key
    tokenExchange:
      enabled: true
      issuer: enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777
      tokenExpiration: 24h
      subjectValidator:
        validatorType: remote
        remoteConfig:
          url: '{{env.keycloak.scheme}}://{{env.domains.core.keycloak}}/realms/agw-dev/protocol/openid-connect/certs'
        skipMayActClaimValidation: true
      actorValidator:
        validatorType: k8s
      apiValidator:
        validatorType: remote
        remoteConfig:
          url: '{{env.keycloak.scheme}}://{{env.domains.core.keycloak}}/realms/agw-dev/protocol/openid-connect/certs'
    agentgatewayModels:
      enabled: true

  gateway:
    hostname: '{{env.domains.core.agentgateway}}'
    sourceRanges:
      - '{{env.security.vpnSourceRanges}}'
      - '{{infra.clusters.demo.network.natGatewayIp}}/32'
    mtls:
      enabled: true
    publicHttps:
      enabled: true

  resources:
    - eks-enterprise-agentgateway-minimal/enterprise-agentgateway-sharedext-params.yaml
    - eks-enterprise-agentgateway-minimal/enterprise-agentgateway-gatewayclass.yaml

  featureGates:
    injectExtAuthCustomCaCert:
      enabled: true
      sourceSecret: keycloak-tls
      sourceNamespace: keycloak

  addons:
    - name: aws-load-balancer-controller
      description: Provisions NLBs (not classic ELBs) that honor the other addons' security-group annotations
      namespace: kube-system
      config:
        clusterName: '{{infra.clusters.demo.cluster}}'
        serviceAccountRoleArn: '{{infra.clusters.demo.iam.albControllerRoleArn}}'

    - name: cert-manager
      description: Certificate management for TLS
      version: '{{env.addons.cert-manager.version}}'
      namespace: cert-manager
      config:
        letsencrypt:
          enabled: true
          email: '{{env.acme.email}}'
          region: '{{env.aws.region}}'

    - name: gateway-mtls
      description: CA chain and server certificate for the Gateway's mTLS listener
      config:
        dnsNames:
          - '{{env.domains.core.agentgateway}}'
        publicHttps:
          enabled: true
          dnsNames:
            - '{{env.domains.core.agentgateway}}'

    - name: external-dns
      description: Automatic DNS record management via Route53
      version: '{{env.addons.external-dns.version}}'
      namespace: external-dns
      config:
        provider: route53
        domainFilter: '{{env.dns.childZone}}.{{env.dns.parentZone.domain}}'
        region: '{{env.aws.region}}'
        txtOwnerId: '{{env.dns.txtOwnerId}}'

    - name: keycloak
      description: Keycloak OIDC Identity Provider
      namespace: keycloak
      keycloakImage: '{{env.keycloak.image}}'
      postgresVersion: 18.6-alpine
      config:
        postgres:
          persistentVolume:
            storageClass: gp3
            size: 5Gi
        keycloakNamespace: keycloak
        hostname: '{{env.domains.core.keycloak}}'
        sourceRanges:
          - '{{env.security.vpnSourceRanges}}'
          - '{{infra.clusters.demo.network.natGatewayIp}}/32'
        protocol: '{{env.keycloak.scheme}}'
        loginTheme: '{{env.keycloak.loginTheme}}'
        tls:
          enabled: true
          secretName: keycloak-tls
          createCertificate: true
        soloUiClients:
          enabled: true
          realm: agw-dev
          hostname: https://{{env.domains.core.soloUi}}
          backendClientId: solo-ui-backend
          backendClientSecret: solo-ui-backend-secret
          frontendClientId: solo-ui-frontend
        realms:
          - realm: agw-dev
            clients:
              - clientId: agw-client
                type: confidential
                clientSecret: agw-client-secret
                flows:
                  - authorization-code
                  - service-account
              - clientId: agw-client-public
                type: public
                flows:
                  - authorization-code
              - clientId: agw-issuer
                type: confidential
                clientSecret: agw-issuer-secret
                directAccessGrantsEnabled: false
                flows:
                  - authorization-code
              - clientId: quota-management
                type: confidential
                clientSecret: quota-management-secret
                flows:
                  - authorization-code
                  - service-account
              - clientId: agw-token-exchange
                type: confidential
                clientSecret: agw-token-exchange-secret
                directAccessGrantsEnabled: false
                flows: []
                attributes:
                  standard.token.exchange.enabled: 'true'
            customAttributes:
              - org_id
              - team_id
              - group
              - is_org_admin
              - is_team_admin
            users:
              - username: acme-corp-admin
                firstName: Acme Corp
                lastName: Admin
                email: acme-corp-admin@acme-corp.demo
                attributes:
                  org_id: acme-corp
                  is_org_admin: 'true'
                  is_team_admin: 'false'
                  group: admins
              - username: user1
                firstName: Alpha
                lastName: User
                email: user1@acme-corp.demo
                # Temporary: testing whether global.Reader is sufficient for a tenant
                # user to view/approve their own pending elicitation in Solo UI.
                soloUiGroup: readers
                attributes:
                  org_id: acme-corp
                  team_id: team-alpha
                  group: users
                  is_org_admin: 'false'
                  is_team_admin: 'false'
              - username: user2
                firstName: Beta
                lastName: User Two
                email: user2@acme-corp.demo
                attributes:
                  org_id: acme-corp
                  team_id: team-beta
                  group: users
                  is_org_admin: 'false'
                  is_team_admin: 'false'
              - username: team-alpha-admin
                firstName: Team Alpha
                lastName: Admin
                email: team-alpha-admin@acme-corp.demo
                attributes:
                  org_id: acme-corp
                  team_id: team-alpha
                  group: users
                  is_org_admin: 'false'
                  is_team_admin: 'true'
              - username: team-beta-admin
                firstName: Team Beta
                lastName: Admin
                email: team-beta-admin@acme-corp.demo
                attributes:
                  org_id: acme-corp
                  team_id: team-beta
                  group: users
                  is_org_admin: 'false'
                  is_team_admin: 'true'
              - username: alice
                firstName: Alice
                lastName: ReBAC
                email: alice@acme-corp.demo
                attributes:
                  org_id: acme
              - username: bob
                firstName: Bob
                lastName: ReBAC
                email: bob@acme-corp.demo
                attributes:
                  org_id: acme
                  team_id: acme-ml
              - username: charlie
                firstName: Charlie
                lastName: ReBAC
                email: charlie@acme-corp.demo
              - username: dave
                firstName: Dave
                lastName: ReBAC
                email: dave@acme-corp.demo
              - username: erin
                firstName: Erin
                lastName: ReBAC
                email: erin@acme-corp.demo
              - username: mcp-user
                firstName: MCP
                lastName: Service
                email: mcp-user@acme-corp.demo

        workloadClients:
          - clientId: caller-agent
            clientSecret: caller-agent-secret
            audience: agentgateway
            k8sSecretName: caller-agent-credentials
            k8sSecretNamespace: agentgateway-system
          - clientId: chain-caller-agent
            clientSecret: chain-caller-agent-secret
            audience: agentgateway
            k8sSecretName: chain-caller-agent-credentials
            k8sSecretNamespace: agentgateway-system
          - clientId: chain-stock-agent
            clientSecret: chain-stock-agent-secret
            audience: agentgateway
            k8sSecretName: chain-stock-agent-credentials
            k8sSecretNamespace: agentgateway-system
          - clientId: loan-agent
            clientSecret: loan-agent-secret
            audience: agentgateway
            k8sSecretName: loan-agent-credentials
            k8sSecretNamespace: agentgateway-system
          - clientId: fd-agent
            clientSecret: fd-agent-secret
            audience: agentgateway
            k8sSecretName: fd-agent-credentials
            k8sSecretNamespace: agentgateway-system

    - name: solo-ui
      description: Solo Enterprise UI
      version: '{{env.soloUi.version}}'
      namespace: agentgateway-system
      config:
        serviceType: ClusterIP
        hostname: '{{env.domains.core.soloUi}}'
        sourceRanges: '{{env.security.vpnSourceRanges}}'
        tls:
          enabled: true
          secretName: solo-ui-tls
          issuer: '{{env.tls.issuer}}'
        oidc:
          enabled: true
          issuerUrl: https://{{env.domains.core.keycloak}}/realms/agw-dev
          backendClientId: solo-ui-backend
          backendClientSecret: solo-ui-backend-secret
          frontendClientId: solo-ui-frontend
