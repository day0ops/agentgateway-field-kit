apiVersion: agentgateway.demo/v1
kind: UseCase
metadata:
  name: virtual-failover-resilience
  description: |
    Fail over from a preferred concrete OpenAI model to a fallback model through a single public virtual model, without the client knowing about either target.

    - Requires the experimental AgentgatewayModel CRD/API enabled (`agentgatewayModels.enabled=true` Helm value on the control plane chart, `installAgentgatewayModelCRD=true` on the CRD chart)
    - `internal-primary` (gpt-4o) and `internal-fallback` (gpt-4o-mini) are Internal - not directly requestable
    - `internal-primary` sets `policies.health.unhealthyCondition: 'true'` so its first response is always marked unhealthy and evicted - demonstrating failover without needing a broken backend
    - `resilient` is a public virtual model: priority 0 = `internal-primary`, priority 1 = `internal-fallback`
  docs: https://docs.solo.io/agentgateway/latest/llm/models/virtual/

spec:
  diagram: |
    flowchart LR
      Client -->|POST model=resilient| MG[models-gateway]
      MG --> VM["AgentgatewayModel resilient (virtual, failover)"]
      VM -->|priority 0, evicted after 1st response| Primary["internal-primary (gpt-4o)"]
      VM -->|priority 1, fallback| Fallback["internal-fallback (gpt-4o-mini)"]

  features:
    - name: gateway
      config:
        name: models-gateway
        listeners:
          - name: http
            port: 8080
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: All
              kinds:
                - group: gateway.networking.k8s.io
                  kind: HTTPRoute
                - group: agentgateway.dev
                  kind: AgentgatewayModel

    - name: agentgateway-model
      description: Two internal concrete targets plus a public virtual model with failover routing
      config:
        sectionName: http
        models:
          - name: internal-primary
            provider: openai
            visibility: Internal
            transformations:
              - field: model
                expression: '"gpt-4o"'
            health:
              unhealthyCondition: 'true'
              eviction:
                consecutiveFailures: 1
          - name: internal-fallback
            provider: openai
            visibility: Internal
            transformations:
              - field: model
                expression: '"gpt-4o-mini"'
          - name: resilient
            virtualModel:
              failover:
                targets:
                  - name: internal-primary
                    priority: 0
                  - name: internal-fallback
                    priority: 1

  tests:
    - name: test-virtual-failover-resilience-first-request-hits-primary
      description: The first request is served by the priority-0 target before it gets evicted
      steps:
        - action: send-request
          endpoint: /v1/chat/completions
          model: resilient
          prompt: 'What is 2+2?'
        - action: verify
          expect:
            status: success
            modelIn:
              - gpt-4o

    - name: test-virtual-failover-resilience-second-request-fails-over
      description: The primary target is now evicted, so the fallback target serves this request
      steps:
        - action: send-request
          endpoint: /v1/chat/completions
          model: resilient
          prompt: 'What is 2+2?'
        - action: verify
          expect:
            status: success
            modelIn:
              - gpt-4o-mini
