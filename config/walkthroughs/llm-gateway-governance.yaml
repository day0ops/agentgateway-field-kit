apiVersion: agentgateway.demo/v1
kind: Walkthrough
metadata:
  name: llm-gateway-governance
  description: |
    A tour of agentgateway's access-control and traffic-shaping capabilities for LLM traffic.
    - identity and RBAC
    - budget and spend limits, stacked as independent tiers
    - prompt guardrails
    - token rate limiting
    - prompt enrichment
    - function calling
    - a capstone screen stacking identity, authorization, budget, and rate limit, against real OpenAI and Anthropic traffic

spec:
  environment: local
  preProvision:
    - name: certificate
      config:
        name: governance-gateway-tls
        secretName: governance-gateway-tls
        issuer: letsencrypt-dns
        dnsNames: ['{{env.domains.app.walkthrough}}']
    - name: gateway
      config:
        name: governance-gateway
        registerDns: true
        listeners:
          - name: https
            port: 443
            protocol: HTTPS
            hostname: '{{env.domains.app.walkthrough}}'
            tls: { mode: Terminate, certificateRefs: [{ name: governance-gateway-tls }] }
            allowedRoutes:
              namespaces:
                from: All
              kinds:
                - group: gateway.networking.k8s.io
                  kind: HTTPRoute
                - group: agentgateway.dev
                  kind: AgentgatewayModel
  credentials:
    alice:
      issuerUrl: 'https://{{env.domains.core.keycloak}}/realms/agw-dev'
      clientId: agw-client-public
    alice2:
      issuerUrl: 'https://{{env.domains.core.keycloak}}/realms/agw-dev'
      clientId: agw-client-public
  screens:
    - name: identity-and-access
      title: Identity and Access
      narration: |
        One endpoint, two gates: a Keycloak JWT proves identity, then OpenFGA decides which models that identity can reach via org/team/direct grants. This screen also switches on Gateway-level API-key auth for a later screen to reuse. The JWT is cached for this session - revisiting after it expires may show 401 instead of 200/403.
      setup:
        - name: openfga
          config:
            namespace: openfga
            image: '{{env.images.openfga.openfga-engine}}'
        - name: providers
          config:
            bodyRouting: true
            pathPrefix: /gov-chat
            providers:
              - name: openai-gpt4o
                providerName: openai
                model: gpt-4o
              - name: openai-gpt35
                providerName: openai
                model: gpt-3.5-turbo
              - name: anthropic-claude35
                providerName: anthropic
                model: claude-sonnet-5
        - name: keycloak-jwt-auth
          config:
            gatewayName: governance-gateway
            keycloakHost: '{{env.domains.core.keycloak}}'
            mode: Optional
            claimHeaders:
              - claim: preferred_username
                header: x-user-id
                fallback: "apiKey['user_id']"
        - name: virtual-keys
          # Switched on here for the budget-and-spend-limits screen to use - none of this
          # screen's own steps send an API key, so it's excluded from this screen's preview.
          skipPreview: true
          config:
            mode: Optional
            location:
              header:
                name: X-Api-Key
            keys:
              - name: alice
                key: sk-alice-demo-abc123def456
                userId: alice
                tokenBudget: 100000
              - name: bob
                key: sk-bob-demo-xyz789uvw012
                userId: bob
                tokenBudget: 100000
              - name: team-ci
                key: sk-team-ci-demo-9f3c7a1e
                userId: team-ci
                tokenBudget: 5000
        - name: openfga-authz
          config:
            policyName: openfga-rebac-policy
            adapterImage: '{{env.images.openfga.openfga-ext-authz}}'
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: providers-gov-chat-route
      steps:
        - kind: http
          label: 'POST /gov-chat (gpt-4o, no credentials)'
          description: No credentials at all - the JWT auth gate rejects this request outright.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-chat'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 401
          # Rejected at the JWT gate, before routing or OpenFGA ever run.
          relevantSetup: [providers, keycloak-jwt-auth]
        - kind: http
          label: 'POST /gov-chat (gpt-4o, alice via JWT)'
          description: alice signs in via Keycloak JWT and OpenFGA grants her access to gpt-4o.
          credential: alice
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-chat'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200
          relevantSetup: [providers, keycloak-jwt-auth, openfga, openfga-authz]
        - kind: http
          label: 'POST /gov-chat (claude-sonnet-5, alice via JWT)'
          description: Same JWT, different model - OpenFGA denies alice access to claude-sonnet-5.
          credential: alice
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-chat'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "claude-sonnet-5", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 403
          relevantSetup: [providers, keycloak-jwt-auth, openfga, openfga-authz]
    - name: budget-and-spend-limits
      title: Budget and Spend Limits
      narration: |
        Virtual API keys carry their own identity and token budget - no JWT required. Usage is recorded after a request completes, so the first request always goes through; bob's 1-token budget then blocks every request after with 429, while alice's only audits the overage. Budgets stack into tiers without cascading - every matching budget is charged independently, so the same traffic counts against bob/alice, team-ci, and the org ceiling at once. team-ci's 25-token budget fills after a couple of requests - watch it reach 100% in the Solo UI while the 10M-token org wildcard barely moves. Uses X-Api-Key, not Authorization, so screen 1's JWT check doesn't misparse it.
      setup:
        - name: providers
          config:
            providers:
              - name: gov-cost-openai
                providerName: openai
                pathPrefix: /gov-cost
                model: gpt-4o-mini
        - name: virtual-keys
          config:
            mode: Optional
            location:
              header:
                name: X-Api-Key
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: governance-gateway-gov-cost-openai
            keys:
              - name: alice
                key: sk-alice-demo-abc123def456
                userId: alice
                tokenBudget: 100000
              - name: bob
                key: sk-bob-demo-xyz789uvw012
                userId: bob
                tokenBudget: 100000
              - name: team-ci
                key: sk-team-ci-demo-9f3c7a1e
                userId: team-ci
                tokenBudget: 5000
        - name: budget-limits
          config:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: governance-gateway-gov-cost-openai
            budgets:
              - name: bob-daily-tokens
                subject:
                  virtualKey: bob
                limit:
                  unit: Tokens
                  amount: 1
                window:
                  unit: Day
                onBudgetExceeded: Block
              - name: alice-daily-tokens
                subject:
                  virtualKey: alice
                limit:
                  unit: Tokens
                  amount: 1
                window:
                  unit: Day
                onBudgetExceeded: Audit
              - name: team-ci-daily-tokens
                subject:
                  virtualKey: team-ci
                limit:
                  unit: Tokens
                  amount: 25
                window:
                  unit: Day
                onBudgetExceeded: Audit
              - name: org-wide-monthly-ceiling
                subject:
                  virtualKey: '*'
                limit:
                  unit: Tokens
                  amount: 10000000
                window:
                  unit: Month
                onBudgetExceeded: Audit
      steps:
        - kind: http
          label: 'POST /gov-cost (bob, first request of the day, establishes usage)'
          description: Budget usage is recorded after a request completes, so bob's first real request of the day still goes through - this one establishes the usage the next request will trip.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-cost'
          resolveGateway: { name: governance-gateway }
          headers:
            X-Api-Key: sk-bob-demo-xyz789uvw012
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /gov-cost (bob, 1-token daily budget exceeded, Block)'
          description: bob's 1-token daily budget is now exhausted from the previous request - this one is blocked with 429.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-cost'
          resolveGateway: { name: governance-gateway }
          headers:
            X-Api-Key: sk-bob-demo-xyz789uvw012
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}'
          expectStatus: 429
        - kind: http
          label: 'POST /gov-cost (alice, 1-token daily budget exceeded, Audit only)'
          description: alice's budget is exhausted too, but her policy only audits the overage - the request still goes through.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-cost'
          resolveGateway: { name: governance-gateway }
          headers:
            X-Api-Key: sk-alice-demo-abc123def456
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}'
          expectStatus: 200
        - kind: http
          label: "POST /gov-cost (team-ci, request 1 of the team tier's daily budget)"
          description: team-ci's shared key starts filling its 25-token daily budget - tracked independently from bob's and alice's individual caps.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-cost'
          resolveGateway: { name: governance-gateway }
          headers:
            X-Api-Key: sk-team-ci-demo-9f3c7a1e
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /gov-cost (team-ci, request 2 fills the team tier - check the Solo UI)'
          description: A second request pushes team-ci's cumulative usage past its 25-token budget. The Audit action lets it through regardless.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-cost'
          resolveGateway: { name: governance-gateway }
          headers:
            X-Api-Key: sk-team-ci-demo-9f3c7a1e
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}'
          expectStatus: 200
    - name: prompt-guardrails
      title: Prompt Guardrails
      narration: |
        A single, self-contained route with no shared Gateway policy, credential, or API key. Its prompt-guards policy scans both request and response: built-in PII detectors (SSN, credit card, phone) and custom regex (injection phrases, password requests) reject before the LLM is reached, and the same builtins mask sensitive data in responses. Unauthenticated by design - this screen only exercises guardrails.
      setup:
        - name: providers
          config:
            providers:
              - name: gov-guardrails-openai
                providerName: openai
                pathPrefix: /gov-guardrails
                model: gpt-4o
        - name: prompt-guards
          config:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: governance-gateway-gov-guardrails-openai
            request:
              customResponse:
                message: 'Request rejected due to policy violation'
              matches:
                - 'credit card'
                - 'ignore previous instructions'
                - 'disregard previous instructions'
                - '(?i)password|passwd|pwd'
              builtins:
                - CreditCard
                - Ssn
                - PhoneNumber
            response:
              builtins:
                - CreditCard
                - Ssn
                - Email
      steps:
        - kind: http
          label: 'POST /gov-guardrails (SSN in prompt, blocked)'
          description: The prompt contains an SSN - the guardrail's PII detector blocks it before it reaches the LLM.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-guardrails'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o", "messages": [{"role": "user", "content": "My SSN is 123-45-6789, can you help me?"}]}'
          expectStatus: 403
        - kind: http
          label: 'POST /gov-guardrails (clean prompt, allowed)'
          description: A clean prompt with no sensitive content passes the guardrail unchanged.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-guardrails'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o", "messages": [{"role": "user", "content": "What is the capital of France?"}]}'
          expectStatus: 200
    - name: token-rate-limiting
      title: Token Rate Limiting
      narration: |
        Counts input tokens per proxy replica, not centrally - each replica enforces its own budget independently. The prompt costs ~5 tokens against a 5-token/minute budget, so the first request fits and the second, fired immediately after, exceeds it with 429. This only holds with a single replica - with more than one, the second request could land on a fresh-budget replica and succeed instead.
      setup:
        - name: providers
          config:
            providers:
              - name: gov-ratelimit-openai
                providerName: openai
                pathPrefix: /gov-ratelimit
                model: gpt-4o-mini
        - name: rate-limit
          config:
            mode: local
            tokens: 5
            burst: 0
            unit: MINUTE
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: governance-gateway-gov-ratelimit-openai
      steps:
        - kind: http
          label: 'POST /gov-ratelimit (first request, within 5-token/minute budget)'
          description: This request's ~5 tokens fit within the 5-token/minute budget.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-ratelimit'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "What is your favorite poem?"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /gov-ratelimit (second request, same minute, budget exceeded)'
          description: Fired immediately after, in the same minute - this one exceeds the budget and gets 429.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-ratelimit'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "What is your favorite poem?"}]}'
          expectStatus: 429
    - name: prompt-enrichment
      title: Prompt Enrichment
      narration: |
        A policy prepends system instructions to every request before it reaches the model, without the client asking for it - here, forcing CSV output on an otherwise plain-text prompt. The policy's instructions are always injected, but a client's own system prompt can still steer the model, so treat enrichment as a default rather than an enforced constraint.
      setup:
        - name: providers
          config:
            providers:
              - name: gov-enrich-openai
                providerName: openai
                pathPrefix: /gov-enrich
                model: gpt-4o-mini
        - name: prompt-enrichment
          config:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: governance-gateway-gov-enrich-openai
            prepend:
              - role: system
                content: 'Parse the unstructured text into CSV format.'
              - role: system
                content: 'Always include a header row with column names.'
      steps:
        - kind: http
          label: 'POST /gov-enrich (plain prompt, no system message - policy forces CSV)'
          description: The client sends no system prompt at all - the policy's prepended instructions still force CSV output.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-enrich'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Seattle, Los Angeles, and Chicago are cities in North America. London, Paris, and Berlin are cities in Europe."}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /gov-enrich (client system prompt steers the model to JSON)'
          description: A client-supplied system prompt asking for JSON sits closer to the user's turn than the policy's prepended CSV instructions, and typically wins.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-enrich'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "system", "content": "Parse the unstructured content and give back a JSON format"}, {"role": "user", "content": "The recipe called for eggs, flour and sugar. The price was $5, $3, and $2."}]}'
          expectStatus: 200
    - name: function-calling
      title: Function Calling
      narration: |
        agentgateway forwards function-calling (tool use) requests unmodified - the model decides whether to call a tool, but execution and validation stay entirely client-side. Attaching a tool definition changes the model's response from a plain-text answer to a tool_call; agentgateway doesn't execute or alter it either way.
      setup:
        - name: providers
          config:
            providers:
              - name: gov-functions-openai
                providerName: openai
                pathPrefix: /gov-functions
                model: gpt-4o-mini
        - name: function-calling
          config:
            enabled: true
            validateRequests: true
      steps:
        - kind: http
          label: 'POST /gov-functions (no tools, plain text answer)'
          description: No tool definitions attached - the model just answers in plain text.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-functions'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "How is the current weather in Columbus?"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /gov-functions (tool attached, model responds with a tool_call)'
          description: Same question, with a get_weather tool attached - the model responds with a tool_call instead of an answer; agentgateway just forwards it, nothing executes server-side.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-functions'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "How is the current weather in Columbus?"}], "tools": [{"type": "function", "function": {"name": "get_weather", "description": "Get the current weather for a location", "parameters": {"type": "object", "properties": {"location": {"type": "string", "description": "The city and state, e.g. San Francisco, CA"}, "format": {"type": "string", "enum": ["celsius", "fahrenheit"]}}, "required": ["location", "format"]}}}], "tool_choice": "required"}'
          expectStatus: 200
    - name: defense-in-depth
      title: Defense in Depth
      narration: |
        The capstone: identity, authorization, budget, and rate limit, stacked on one route. Each layer is enforced independently - a request can pass one and still be rejected by the next.
        - identity: a JWT or virtual API key proves who's calling.
        - authorization: OpenFGA decides which models that identity can reach - alice reaches gpt-4o-mini via org:acme, but is denied claude-sonnet-5 since she isn't on team:acme-ml.
        - budget: five budgets cap spend across org/team/user/automation-key levels - usage is recorded after completion, so team-ci's first request goes through and exhausts its 1-token budget.
        - rate limit: team-ci's second request fails twice over - its budget is already exhausted, and the route's shared token-bucket rate limit is too, so it's rejected either way.
      setup:
        - name: openfga
          config:
            namespace: openfga
            image: '{{env.images.openfga.openfga-engine}}'
        - name: providers
          config:
            bodyRouting: true
            pathPrefix: /gov-chat-tiered
            providers:
              - name: openai-gpt4o-mini
                providerName: openai
                model: gpt-4o-mini
              - name: openai-gpt4o
                providerName: openai
                model: gpt-4o
              - name: anthropic-claude-sonnet
                providerName: anthropic
                model: claude-sonnet-5
        - name: keycloak-jwt-auth
          config:
            gatewayName: governance-gateway
            keycloakHost: '{{env.domains.core.keycloak}}'
            mode: Optional
            claimHeaders:
              - claim: preferred_username
                header: x-user-id
                fallback: "apiKey['user_id']"
        - name: virtual-keys
          config:
            mode: Optional
            location:
              header:
                name: X-Api-Key
            keys:
              - name: alice
                key: sk-alice-demo-abc123def456
                userId: alice
                tokenBudget: 100000
              - name: bob
                key: sk-bob-demo-xyz789uvw012
                userId: bob
                tokenBudget: 100000
              - name: team-ci
                key: sk-team-ci-demo-9f3c7a1e
                userId: team-ci
                tokenBudget: 5000
        - name: openfga-authz
          config:
            policyName: tiered-cost-control-authz
            adapterImage: '{{env.images.openfga.openfga-ext-authz}}'
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: providers-gov-chat-tiered-route
        - name: budget-limits
          config:
            budgetsResourceName: human-budgets
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: providers-gov-chat-tiered-route
            budgets:
              - name: acme-org-monthly-ceiling
                subject:
                  org_id: acme
                limit:
                  unit: USD
                  amount: 200
                window:
                  unit: Month
                onBudgetExceeded: Audit
              - name: acme-ml-team-monthly-cap
                subject:
                  team_id: acme-ml
                limit:
                  unit: USD
                  amount: 50
                window:
                  unit: Month
                onBudgetExceeded: Block
              - name: alice-daily-cap
                subject:
                  username: alice
                limit:
                  unit: USD
                  amount: 5
                window:
                  unit: Day
                onBudgetExceeded: Block
              - name: bob-daily-cap
                subject:
                  username: bob
                limit:
                  unit: USD
                  amount: 10
                window:
                  unit: Day
                onBudgetExceeded: Block
              - name: team-ci-daily-cap
                subject:
                  virtualKey: team-ci
                limit:
                  unit: Tokens
                  amount: 1
                window:
                  unit: Day
                onBudgetExceeded: Block
        - name: rate-limit
          config:
            name: chat-burst-limit
            type: TOKEN
            requestsPerUnit: 30
            unit: MINUTE
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: providers-gov-chat-tiered-route
      steps:
        - kind: http
          label: 'POST /gov-chat-tiered (gpt-4o-mini, alice via JWT, allowed)'
          description: alice's org:acme entitlement allows gpt-4o-mini, and every budget/rate-limit layer still has headroom.
          credential: alice2
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-chat-tiered'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /gov-chat-tiered (claude-sonnet-5, alice via JWT, denied by OpenFGA)'
          description: alice isn't on team:acme-ml - OpenFGA denies claude-sonnet-5 before the budget layer is ever reached.
          credential: alice2
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-chat-tiered'
          resolveGateway: { name: governance-gateway }
          body: '{"model": "claude-sonnet-5", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 403
        - kind: http
          label: 'POST /gov-chat-tiered (gpt-4o-mini, team-ci via API key, first request establishes usage)'
          description: Budget usage is recorded after a request completes, so team-ci's first real request of the day still goes through - this one establishes the usage the next request will trip.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-chat-tiered'
          resolveGateway: { name: governance-gateway }
          headers:
            X-Api-Key: sk-team-ci-demo-9f3c7a1e
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /gov-chat-tiered (gpt-4o-mini, team-ci via API key, denied by budget and rate limit)'
          description: team-ci is entitled to gpt-4o-mini, but its 1-token daily budget is now exhausted - the route's shared rate limit is also exhausted from the two calls so far, so this fails twice over.
          method: POST
          url: 'https://{{env.domains.app.walkthrough}}/gov-chat-tiered'
          resolveGateway: { name: governance-gateway }
          headers:
            X-Api-Key: sk-team-ci-demo-9f3c7a1e
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}'
          expectStatus: 429
