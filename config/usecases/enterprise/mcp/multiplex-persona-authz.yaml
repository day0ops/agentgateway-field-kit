apiVersion: agentgateway.demo/v1
kind: UseCase
metadata:
  name: multiplex-persona-authz
  description: |
    Per-persona CEL tool access control across a federated (multiplexed) MCP backend, keyed on the federation target rather than the individual tool - plus failureMode: FailOpen so one unreachable target doesn't take down the whole backend.
  docs: https://docs.solo.io/agentgateway/latest/mcp/virtual/

spec:
  diagram: |
    sequenceDiagram
      participant U1 as user1
      participant U2 as user2
      participant AGW as agentgateway
      participant KC as Keycloak
      participant Stock as Stock MCP
      participant Currency as Currency MCP
      participant Random as Random MCP
      U1->>AGW: POST /mcp + Bearer JWT (user1)
      AGW->>KC: validate JWT
      AGW->>AGW: CEL RBAC (jwt.preferred_username, mcp.tool.target)
      AGW->>Stock: forward (target allowed for user1)
      AGW->>Currency: forward (target allowed for user1)
      Note over AGW,Random: random-server-mcp target hidden from user1
      U2->>AGW: POST /mcp + Bearer JWT (user2)
      AGW->>Random: forward (target allowed for user2)
      Note over AGW,Stock: stock/currency targets hidden from user2

  steps:
    - title: Deploy a 3-target federated MCP backend with FailOpen resilience
      description: |
        Deploy three MCP server workloads (stock, currency, random) and multiplex them behind a single AgentgatewayBackend using label selectors, so clients see all three through one endpoint and one MCP connection. failureMode: FailOpen keeps the other two targets' tools available if one target becomes unreachable, instead of failing the whole backend. Only Streamable HTTP is supported for label selectors.
      features:
        - name: mcp-server
          config:
            servers:
              - name: stock-server-mcp
                image: '{{env.images.stock-server-mcp}}'
                serverPort: 8000
                servicePort: 80
              - name: currency-server-mcp
                image: '{{env.images.currency-server-mcp}}'
                serverPort: 8000
                servicePort: 80
              - name: random-server-mcp
                image: '{{env.images.random-server-mcp}}'
                serverPort: 8000
                servicePort: 80
            protocol: StreamableHTTP
            mcpPath: /mcp
            backendName: mcp-backend
            targets:
              - name: stock-server-mcp
                matchLabels:
                  app: stock-server-mcp
              - name: currency-server-mcp
                matchLabels:
                  app: currency-server-mcp
              - name: random-server-mcp
                matchLabels:
                  app: random-server-mcp
            failureMode: FailOpen
            routeName: mcp

    - title: Enforce MCP auth
      description: |
        Protect the multiplexed MCP backend with OAuth 2.0 via Keycloak so only authenticated clients with a valid JWT can reach any of the three federated targets.
      features:
        - name: mcp-auth
          config:
            policyName: mcp-auth
            backendName: mcp-backend
            routeName: mcp
            mcpPath: /mcp
            keycloak:
              realm: agw-dev
              serviceName: keycloak
              serviceNamespace: keycloak
              servicePort: 443
              externalUrl: '{{env.keycloak.scheme}}://{{env.domains.keycloak}}'
              configureDynamicRegistration: true
              grantAudienceToClients:
                - agw-client
            audiences:
              - http://localhost:8080/mcp
            resource: http://localhost:8080/mcp
            scopesSupported:
              - email
            mode: Strict
            provider: Keycloak

    - title: Restrict tool access per persona by federation target
      description: |
        Apply an AgentgatewayPolicy targeting the multiplexed backend with CEL matchExpressions keyed on mcp.tool.target - the federation target identifier - rather than mcp.tool.name, so access is granted per backend server instead of per individual tool. user1 gets the stock and currency targets; user2 gets only the random target.
      features:
        - name: mcp-tool-access
          config:
            policyName: mcp-persona-authz
            backendName: mcp-backend
            action: Allow
            matchExpressions:
              - 'jwt.preferred_username == "user1" && (mcp.tool.target == "stock-server-mcp" || mcp.tool.target == "currency-server-mcp")'
              - 'jwt.preferred_username == "user2" && mcp.tool.target == "random-server-mcp"'

  tests:
    - name: test-user1-sees-stock-and-currency-tools-only
      description: user1's tools/list shows only the stock and currency targets' tools, filtered by the federation-target CEL policy
      steps:
        - action: get-token
          keycloak:
            realm: agw-dev
            clientId: agw-client
            clientSecret: agw-client-secret
            grantType: password
            username: user1
            password: Password1!
            hostname: '{{env.domains.keycloak}}'
            scheme: '{{env.keycloak.scheme}}'
        - action: send-mcp-request
          endpoint: /mcp
          method: tools/list
          auth: bearer
        - action: verify
          expect:
            status: success
            contains:
              - get_stock_price
              - get_exchange_rate
            notContains: random_int

    - name: test-user2-sees-random-tools-only
      description: user2's tools/list shows only the random target's tools, filtered by the federation-target CEL policy
      steps:
        - action: get-token
          keycloak:
            realm: agw-dev
            clientId: agw-client
            clientSecret: agw-client-secret
            grantType: password
            username: user2
            password: Password1!
            hostname: '{{env.domains.keycloak}}'
            scheme: '{{env.keycloak.scheme}}'
        - action: send-mcp-request
          endpoint: /mcp
          method: tools/list
          auth: bearer
        - action: verify
          expect:
            status: success
            contains: random_int
            notContains:
              - get_stock_price
              - get_exchange_rate

    - name: test-failopen-resilience-on-target-outage
      description: |
        Scale the random-server-mcp target to zero replicas and verify user1's tools/list still succeeds with the stock and currency tools intact - failureMode: FailOpen keeps the rest of the federated backend serving instead of failing the whole call when one target becomes unreachable. The wait below has not been live-timed against a real cluster; increase it if the Service's endpoint doesn't clear before the request fires.
      steps:
        - action: scale-deployment
          name: random-server-mcp
          replicas: 0
        - action: wait
          duration: 10000
        - action: get-token
          keycloak:
            realm: agw-dev
            clientId: agw-client
            clientSecret: agw-client-secret
            grantType: password
            username: user1
            password: Password1!
            hostname: '{{env.domains.keycloak}}'
            scheme: '{{env.keycloak.scheme}}'
        - action: send-mcp-request
          endpoint: /mcp
          method: tools/list
          auth: bearer
        - action: verify
          expect:
            status: success
            contains:
              - get_stock_price
              - get_exchange_rate
      teardown:
        - action: scale-deployment
          name: random-server-mcp
          replicas: 1
