apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: routing-dynamic
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: agentgateway-demo-wizard
spec:
  parentRefs:
    - name: agentgateway-gw
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /chat/dynamic
          headers:
            - name: X-Model-Tier
              value: premium
      backendRefs:
        - name: routing-dynamic-premium
          namespace: agentgateway-system
          group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
    - matches:
        - path:
            type: PathPrefix
            value: /chat/dynamic
          headers:
            - name: X-Model-Tier
              value: fast
      backendRefs:
        - name: routing-dynamic-fast
          namespace: agentgateway-system
          group: enterpriseagentgateway.solo.io
          kind: EnterpriseAgentgatewayBackend
