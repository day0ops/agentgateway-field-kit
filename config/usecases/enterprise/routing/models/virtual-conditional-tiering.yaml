apiVersion: agentgateway.demo/v1
kind: UseCase
metadata:
  name: virtual-conditional-tiering
  description: |
    Route to a different concrete OpenAI model based on a request header, through a single public virtual model, without the client knowing about either target.

    - Requires the experimental AgentgatewayModel CRD/API enabled (`agentgatewayModels.enabled=true` Helm value on the control plane chart, `installAgentgatewayModelCRD=true` on the CRD chart)
    - `internal-fast` (gpt-4o-mini) and `internal-premium` (gpt-4o) are Internal - not directly requestable
    - `smart` is a public virtual model: `x-model-tier: premium` routes to `internal-premium`, everything else falls back to `internal-fast`
  docs: https://docs.solo.io/agentgateway/latest/llm/models/virtual/

spec:
  diagram: |
    flowchart LR
      Client -->|POST model=smart| MG[models-gateway]
      MG --> VM["AgentgatewayModel smart (virtual, conditional)"]
      VM -->|"x-model-tier: premium"| Premium["internal-premium (gpt-4o)"]
      VM -->|fallback| Fast["internal-fast (gpt-4o-mini)"]

  features:
    - name: gateway
      config:
        name: models-gateway
        listeners:
          - name: http
            port: 8080
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: All
              kinds:
                - group: gateway.networking.k8s.io
                  kind: HTTPRoute
                - group: agentgateway.dev
                  kind: AgentgatewayModel

    - name: agentgateway-model
      description: Two internal concrete targets plus a public virtual model with conditional routing
      config:
        sectionName: http
        models:
          - name: internal-fast
            provider: openai
            visibility: Internal
            transformations:
              - field: model
                expression: '"gpt-4o-mini"'
          - name: internal-premium
            provider: openai
            visibility: Internal
            transformations:
              - field: model
                expression: '"gpt-4o"'
          - name: smart
            virtualModel:
              conditional:
                targets:
                  - when: 'request.headers["x-model-tier"] == "premium"'
                    name: internal-premium
                  - name: internal-fast

  tests:
    - name: test-virtual-conditional-tiering-premium-header
      description: Premium header routes to the gpt-4o target
      steps:
        - action: send-request
          endpoint: /v1/chat/completions
          model: smart
          prompt: 'What is 2+2?'
          headers:
            x-model-tier: premium
        - action: verify
          expect:
            status: success
            modelIn:
              - gpt-4o

    - name: test-virtual-conditional-tiering-fallback
      description: No header falls back to the gpt-4o-mini target
      steps:
        - action: send-request
          endpoint: /v1/chat/completions
          model: smart
          prompt: 'What is 2+2?'
        - action: verify
          expect:
            status: success
            modelIn:
              - gpt-4o-mini
