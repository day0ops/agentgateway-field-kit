apiVersion: agentgateway.demo/v1
kind: UseCase
metadata:
  name: agentgateway-demo-wizard
  description: |
    Deploys the agentgateway-demo-wizard clickops app (github.com/day0ops/agentgateway-demo-wizard), locked to VPN source ranges behind its own HTTPS Gateway.

    - Routing pillar: pre-provisions the model-by-name, dynamic-tier, and fallback backends it displays
    - Banking auth pillar: real ADK agents and MCP infrastructure demonstrating Impersonation, MCP tool-level RBAC, Delegation (nested act chain), and Elicitation (Stripe sandbox, Interactive + Brokered)
  docs: https://docs.solo.io/agentgateway/latest/mcp/token-exchange/
spec:
  steps:
    - title: Pre-provision routing-by-name backends
      description: |
        Creates the OpenAI and Anthropic backends for the wizard's model-by-name routing step, route already live.
      features:
        - name: providers
          config:
            bodyRouting: true
            pathPrefix: /chat/by-name
            providers:
              - name: routing-by-name-openai
                providerName: openai
                model: gpt-4o-mini
              - name: routing-by-name-anthropic
                providerName: anthropic
                model: claude-sonnet-5

    - title: Pre-provision dynamic-tier backends
      description: |
        Creates the fast/premium backends for the wizard's dynamic-tier routing step; the HTTPRoute itself is bundled by the wizard feature.
      features:
        - name: providers
          config:
            createRoute: false
            providers:
              - name: routing-dynamic-fast
                providerName: openai
                model: gpt-4o-mini
              - name: routing-dynamic-premium
                providerName: openai
                model: gpt-4o

    - title: Pre-provision the fallback backend
      description: |
        Creates the priority-grouped fallback backend for the wizard's automatic-fallback step.
      features:
        - name: providers
          config:
            pathPrefix: /chat/fallback
            name: routing-fallback
            groups:
              - providers:
                  - name: routing-fallback-cheap
                    providerName: openai
                    model: gpt-4o-mini
              - providers:
                  - name: routing-fallback-premium
                    providerName: openai
                    model: gpt-4o

    - title: Deploy LLM provider
      description: |
        Exposes an OpenAI LLM provider at /openai that the four agents route completions through.
      features:
        - name: providers
          config:
            providers:
              - name: openai
                providerName: openai
                pathPrefix: /openai

    - title: Deploy Postgres for the ops-agents token exchange service
      description: |
        Dedicated Postgres instance backing this usecase's own STS database.
      features:
        - name: postgres
          config:
            name: ops-agents-postgres

    - title: Enable the Security Token Service (STS)
      description: |
        Enables the agentgateway control plane's STS at port 7777 and its OAuth issuer (consent enabled) for the Brokered Stripe elicitation step below.
      features:
        - name: token-exchange
          config:
            subjectValidator:
              validatorType: remote
              remoteConfig:
                url: 'https://{{env.domains.core.keycloak}}/realms/agw-dev/protocol/openid-connect/certs'
              skipMayActClaimValidation: true
            apiValidator:
              validatorType: remote
              remoteConfig:
                url: 'https://{{env.domains.core.keycloak}}/realms/solo-ui/protocol/openid-connect/certs'
            tokenExpiration: 1h
            skipMayActClaimValidation: true
            callbackUrl: 'https://{{env.domains.core.agentgatewayUi}}/age/elicitations'
            database:
              postgres:
                url: postgres://tokenexchange:tokenexchange@ops-agents-postgres.agentgateway-system.svc.cluster.local:5432/tokenexchange?sslmode=disable
            oauthIssuerConfig:
              downstream_server:
                name: agw-dev
                client_id: agw-token-exchange
                authorize_url: 'https://{{env.domains.core.keycloak}}/realms/agw-dev/protocol/openid-connect/auth'
                token_url: 'https://{{env.domains.core.keycloak}}/realms/agw-dev/protocol/openid-connect/token'
                scopes: [openid, profile]
              gateway_config:
                base_url: 'https://{{env.domains.core.agentgateway}}/oauth-issuer'
              par_config:
                enabled: true
              consent:
                enabled: true
                platform_name: Agentgateway Demo Console

    - title: Deploy the Core Banking MCP server
      description: |
        Deploys the internal core-banking MCP (a fake ledger) at /core-banking-standard, carrying the Impersonation exchange the Accounts Agent reads through.
      features:
        - name: mcp-server
          config:
            deployServer: true
            image: '{{env.images.opsAgents.core-banking}}'
            serverName: core-banking
            serverPort: 8000
            servicePort: 80
            protocol: StreamableHTTP
            mcpPath: /mcp
            pathPrefix: /core-banking-standard
            backendName: core-banking-standard-backend
            targetName: core-banking-standard-target
            routeName: core-banking-standard

    - title: Expose a second route to the Core Banking MCP for the Delegation path
      description: |
        Second route/backend to the same pod, carrying only STS-issued Delegation tokens for the Settlement Agent's transfer calls.
      features:
        - name: mcp-server
          config:
            deployServer: false
            backendName: core-banking-delegation-backend
            targetName: core-banking-delegation-target
            routeName: core-banking-delegation
            pathPrefix: /core-banking-delegation
            targets:
              - name: core-banking-delegation-target
                host: core-banking.agentgateway-system.svc.cluster.local
                port: 80
                protocol: StreamableHTTP
                path: /mcp

    - title: Protect the standard route with the proxy-native Impersonation exchange
      description: |
        Performs the RFC 8693 Impersonation exchange (re-signed, no act claim) on the standard route before forwarding to core-banking.
      features:
        - name: oauth-token-exchange
          config:
            name: core-banking-standard-exchange
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: core-banking-standard
            jwtAuthentication:
              issuer: 'https://{{env.domains.core.keycloak}}/realms/agw-dev'
              audiences: [account]
              jwks:
                host: '{{env.domains.core.keycloak}}'
                path: realms/agw-dev/protocol/openid-connect/certs
            tokenEndpoint:
              host: '{{env.domains.core.keycloak}}'
              path: /realms/agw-dev/protocol/openid-connect/token
            clientAuth:
              clientId: agw-token-exchange

    - title: Protect the delegation route with STS-issued-token validation
      description: |
        Validates the delegation route accepts tokens from either the STS (normal chain) or Keycloak directly (raw token, used by the direct-call demo).
      features:
        - name: obo-token-exchange
          config:
            policyName: core-banking-delegation-jwt-policy
            jwtMode: Strict
            providers:
              - issuer: '{{env.internal.stsIssuer}}'
                jwksPath: /.well-known/jwks.json
                jwksBackend:
                  name: enterprise-agentgateway
                  namespace: agentgateway-system
                  port: 7777
                audiences: [agentgateway]
              - issuer: 'https://{{env.domains.core.keycloak}}/realms/agw-dev'
                audiences: [account]
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: core-banking-delegation

    - title: Deploy the Accounts Agent (read-only, Impersonation)
      description: |
        Reads the customer's balances/transactions, presenting the user's token unchanged for the gateway's Impersonation exchange.
      features:
        - name: workload-agent
          config:
            agentName: accounts-agent
            image: '{{env.images.opsAgents.accounts-agent}}'
            pathPrefix: /accounts-agent
            routeName: accounts-agent
            useTokenExchange: false
            llmBaseUrl: '{{env.internal.agentgateway}}/openai'
            additionalEnv:
              - name: MCP_CORE_BANKING_URL
                value: '{{env.internal.agentgateway}}/core-banking-standard/mcp'

    - title: Deploy the Transfer Orchestrator Agent (hop 1 of the delegation chain)
      description: |
        Exchanges the user's token at the STS, then delegates the ledger operation to the Settlement Agent.
      features:
        - name: workload-agent
          config:
            agentName: transfer-orchestrator-agent
            image: '{{env.images.opsAgents.transfer-orchestrator-agent}}'
            pathPrefix: /transfer-orchestrator-agent
            routeName: transfer-orchestrator-agent
            useTokenExchange: true
            saTokenAudience: agentgateway
            llmBaseUrl: '{{env.internal.agentgateway}}/openai'
            additionalEnv:
              - name: STS_URL
                value: '{{env.internal.sts}}'
              - name: SETTLEMENT_AGENT_URL
                value: '{{env.internal.agentgateway}}/settlement-agent/run'

    - title: Deploy the Settlement Agent (hop 2, re-exchanges and surfaces the chain)
      description: |
        Re-exchanges the delegated token at the STS (nested act chain), calls the core-banking transfer tool, and reports the chain of custody.
      features:
        - name: workload-agent
          config:
            agentName: settlement-agent
            image: '{{env.images.opsAgents.settlement-agent}}'
            pathPrefix: /settlement-agent
            routeName: settlement-agent
            useTokenExchange: true
            saTokenAudience: agentgateway
            llmBaseUrl: '{{env.internal.agentgateway}}/openai'
            additionalEnv:
              - name: STS_URL
                value: '{{env.internal.sts}}'
              - name: MCP_CORE_BANKING_DELEGATION_URL
                value: '{{env.internal.agentgateway}}/core-banking-delegation/mcp'

    - title: Deploy the Statements Agent (Elicitation)
      description: |
        Reaches the Stripe sandbox on the customer's behalf; the first call with no stored credential triggers elicitation.
      features:
        - name: workload-agent
          config:
            agentName: statements-agent
            image: '{{env.images.opsAgents.statements-agent}}'
            pathPrefix: /statements-agent
            routeName: statements-agent
            useTokenExchange: false
            llmBaseUrl: '{{env.internal.agentgateway}}/openai'
            additionalEnv:
              - name: MCP_STRIPE_URL
                value: '{{env.internal.agentgateway}}/mcp-stripe-brokered'
              - name: MCP_PAYPAL_URL
                value: '{{env.internal.agentgateway}}/mcp-paypal'

    - title: Create the PayPal OAuth client secret
      description: |
        Registers a PayPal MCP OAuth client (DCR) for the Interactive elicitation path, since Stripe's OAuth app can't issue a client secret.
      features:
        - name: elicitation-secret
          config:
            secretName: ops-agents-paypal-oauth
            provider: paypal
            clientSecretEnvVar: AGW_DEMO_PAYPAL_CLIENT_SECRET

    - title: Configure the PayPal MCP backend with Interactive Elicitation
      description: |
        Points agentgateway at PayPal's sandbox MCP server with Interactive elicitation, prompting OAuth consent on first use.
      features:
        - name: elicitation-backend
          config:
            mode: interactive
            backendName: paypal-mcp-backend
            policyName: paypal-mcp-elicitation
            routeName: mcp-paypal
            pathPrefix: /mcp-paypal
            secretName: ops-agents-paypal-oauth
            provider: paypal
            clientIdEnvVar: AGW_DEMO_PAYPAL_CLIENT_ID
            authorizeUrl: https://mcp.sandbox.paypal.com/authorize
            accessTokenUrl: https://mcp.sandbox.paypal.com/token
            redirectUri: 'https://{{env.domains.core.agentgatewayUi}}/age/elicitations'
            upstream:
              host: mcp.sandbox.paypal.com
              port: 443
              path: /mcp
              tls: true

    - title: Configure the Stripe MCP backend with Brokered Elicitation
      description: |
        Points agentgateway at Stripe's MCP server with Brokered elicitation, brokering the upstream credential inline via the gateway's own OAuth issuer and consent screen.
      features:
        - name: elicitation-backend
          config:
            mode: brokered
            backendName: stripe-mcp-brokered-backend
            policyName: stripe-mcp-brokered
            routeName: mcp-stripe-brokered
            pathPrefix: /mcp-stripe-brokered
            upstream:
              host: mcp.stripe.com
              port: 443
              path: /
              tls: true
            brokered:
              mcpResourcePath: /mcp-stripe-brokered
              chainedAuth:
                baseUrl: https://mcp.stripe.com
                scopes: ['mcp']

    - title: Deploy the wizard
      description: |
        Deploys the wizard app: Deployment, Service, scoped RBAC, its own VPN-locked HTTPS Gateway, and the dynamic-tier HTTPRoute.
      features:
        - name: agentgateway-demo-wizard
          config:
            image: '{{env.images.wizard.agentgateway-demo-wizard}}'
            agwHost: '{{env.domains.core.agentgateway}}'
            keycloakHost: '{{env.domains.core.keycloak}}'
            hostname: '{{env.domains.app.wizard}}'
            sourceRanges: '{{env.security.vpnSourceRanges}}'
            tls:
              enabled: true

    - title: Protect the auth pillar's real-agent routes with agentgateway's own ext-auth
      description: |
        Gates the /secure prefix with agentgateway's own OAuth authorization-code flow, forwarding the token upstream as a Bearer header; other routes are untouched.
      features:
        - name: oauth-authorization-code
          config:
            authConfigName: agw-ext-auth
            policyName: agw-ext-auth
            secretName: agw-ext-auth-oauth
            issuerUrl: 'https://{{env.domains.core.keycloak}}/realms/agw-dev/'
            clientId: agw-ext-auth
            clientSecret: agw-ext-auth-secret
            appUrl: 'https://{{env.domains.app.wizard}}'
            callbackPath: /secure/oidc-callback
            logoutPath: /secure/logout
            scopes: [email]
            headers:
              accessTokenHeader: Authorization
              useBearerSchemaForAuthorization: true
            session:
              allowRefreshing: true
              preExpiryBufferSeconds: 30
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: agentgateway-demo-wizard-secure

  tests: []
