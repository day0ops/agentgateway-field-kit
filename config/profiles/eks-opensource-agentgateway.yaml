apiVersion: agentgateway.demo/v1
kind: Profile
metadata:
  name: eks-opensource-agentgateway
  description: |
    Opensource agentgateway on EKS
    - Keycloak integration
    - Route53 DNS, TLS via cert-manager
spec:
  edition: opensource
  environment: aws-dev
  infra: eks-single-cluster

  agentgateway:
    version: 1.5.0
    ociRegistry: oci://cr.agentgateway.dev/charts

  agentgateway-crds:
    version: 1.5.0
    ociRegistry: oci://cr.agentgateway.dev/charts

  gatewayApi:
    version: v1.6.2
    channel: experimental

  helmValues:
    agentgatewayModels:
      enabled: true

  gateway:
    hostname: '{{env.domains.core.agentgateway}}'

  addons:
    - name: cert-manager
      description: Certificate management for TLS
      version: 1.21.2
      namespace: cert-manager
      config:
        letsencrypt:
          enabled: true
          email: '{{env.acme.email}}'
          region: '{{env.aws.region}}'

    - name: external-dns
      description: Automatic DNS record management via Route53
      version: 1.22.0
      namespace: external-dns
      config:
        provider: route53
        domainFilter: '{{env.dns.childZone}}.{{env.dns.parentZone.domain}}'
        region: '{{env.aws.region}}'
        txtOwnerId: '{{env.dns.txtOwnerId}}'

    - name: keycloak
      description: Keycloak OIDC Identity Provider
      namespace: keycloak
      keycloakImage: '{{env.keycloak.image}}'
      postgresVersion: 18.6-alpine
      config:
        postgres:
          persistentVolume:
            storageClass: gp3
            size: 5Gi
        keycloakNamespace: keycloak
        hostname: '{{env.domains.core.keycloak}}'
        protocol: '{{env.keycloak.scheme}}'
        loginTheme: '{{env.keycloak.loginTheme}}'
        tls:
          enabled: true
          secretName: keycloak-tls
          createCertificate: true
        realms:
          - realm: agw-dev
            defaultPassword: Password1!
            clients:
              - clientId: agw-client
                type: confidential
                clientSecret: agw-client-secret
                flows:
                  - authorization-code
                  - service-account

    - name: telemetry
      description: OpenTelemetry observability stack (Prometheus, Grafana, Loki, Tempo)
      namespace: telemetry
      chartVersions: '{{env.telemetry.version}}'
      config:
        gatewayNamespace: agentgateway-system
        database:
          storageClass: gp3
          storageSize: 100Gi
        retention: 120h
        grafanaServiceType: LoadBalancer
        grafanaHostname: '{{env.domains.core.grafana}}'
