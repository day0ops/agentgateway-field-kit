apiVersion: agentgateway.demo/v1
kind: Environment
metadata:
  name: local
  description: Local Kubernetes cluster (lok8s)

spec:
  # No infraProfile or dns - purely local cluster
  tls:
    issuer: selfsigned-issuer

  keycloak:
    image: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/keycloak:latest
    scheme: http

  soloUi:
    version: 0.5.8

  telemetry:
    version:
      kube-prom-stack: 91.5.0
      loki: 7.3.0
      tempo: 1.61.3
      alloy: 1.12.1
      otel: 0.173.1

  # Custom demo images, built and pushed to this GAR repo. Each value is a full
  # repo:tag reference - bump the tag here to roll every usecase forward at once.
  images:
    stock-agent: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/stock-agent:latest
    caller-agent: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/caller-agent:latest
    stock-server-mcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/stock-server-mcp:0.1.1
    currency-server-mcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/currency-server-mcp:0.1.1
    random-server-mcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/random-server-mcp:latest
    fd-server-mcp: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/fd-server-mcp:latest
    mcp-graph-me-tool: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/mcp-graph-me-tool:0.1.0
    fd-agent: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/fd-agent:0.1.3
    loan-agent: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/loan-agent:0.1.3
    quota-budget-extproc: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/quota-budget-extproc:0.1.3
    quota-management-ui: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/quota-management-ui:0.1.3
    quota-ratelimit-extproc: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/quota-ratelimit-extproc:0.1.3
    opik-guardrail-webhook: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/opik-guardrail-webhook:0.1.2
    sidecar-agent: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/sidecar-agent:0.1.1
    opa-ext-authz: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/opa-ext-authz:latest
    openfga-engine: openfga/openfga:v1.10.3
    openfga-ext-authz: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/openfga-ext-authz:latest
    ext-mcp-guardrail: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/ext-mcp-guardrail:latest
    preissuance-ext-authz: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/preissuance-ext-authz:latest

  internal:
    agentgateway: http://agentgateway.agentgateway-system.svc.cluster.local:8080
    sts: http://enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777/oauth2/token
    stsIssuer: enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777

  domains:
    core:
      keycloak: keycloak.keycloak.svc.cluster.local
      grafana: kube-prometheus-stack-grafana.telemetry.svc.cluster.local
      soloUi: solo-enterprise-ui.agentgateway-system.svc.cluster.local
      agentgateway: agentgateway.agentgateway-system.svc.cluster.local
    app:
      quotaManagement: quota-management.agentgateway-system.svc.cluster.local

  # Okta tenant
  okta:
    domain: dev-12345.okta.com

  # Placeholder Entra ID (Azure AD) tenant/app registration
  entra:
    tenantId: 00000000-0000-0000-0000-000000000000
    clientId: 00000000-0000-0000-0000-000000000000

  # Placeholder Auth0 tenant - replace with a real tenant to test
  # mcp-eager-auth-auth0 end-to-end; the discovery/401 tests don't need one.
  auth0:
    domain: dev-00000000.us.auth0.com
    audience: https://agentgateway.example.com/mcp
