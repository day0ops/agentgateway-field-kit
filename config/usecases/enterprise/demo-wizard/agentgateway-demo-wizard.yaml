apiVersion: agentgateway.demo/v1
kind: UseCase
metadata:
  name: agentgateway-demo-wizard
  description: |
    Deploys the agentgateway-demo-wizard clickops app (github.com/day0ops/agentgateway-demo-wizard), locked to VPN source ranges behind its own HTTPS Gateway.

    - Routing pillar: pre-provisions the model-by-name, dynamic-tier, and fallback backends it displays
    - Banking auth pillar: real ADK agents and MCP infrastructure demonstrating Impersonation, MCP tool-level RBAC, Delegation (nested act chain), and Elicitation (Stripe sandbox, Interactive + Brokered)
    - Tool-modes pillar: federates Core Banking + stock + currency MCP servers under Standard/Search toolMode routes so the wizard's savings scoreboard measures a real gateway, not a mock - Code/CodeSearch are omitted since the model's generated code isn't deterministic enough for a repeatable demo
    - Multi-tenant isolation pillar: deploys a dedicated agentgateway-tenants Gateway proving cross-tenant entitlement (deny-by-default CEL rule), header-forgery resistance, and independent per-tenant budgets across three Keycloak org realms (acme, globex, initech) on one shared model route - requires a profile with those realms seeded (eks-enterprise-agentgateway-complete, its -lts variant, or agentgateway-with-keycloak)
  docs: https://docs.solo.io/agentgateway/latest/mcp/token-exchange/
spec:
  steps:
    - title: Pre-provision routing-by-name backends
      description: |
        Creates the OpenAI and Anthropic backends for the wizard's model-by-name routing step, route already live.
      features:
        - name: providers
          config:
            bodyRouting: true
            pathPrefix: /chat/by-name
            providers:
              - name: routing-by-name-openai
                providerName: openai
                model: gpt-4o-mini
              - name: routing-by-name-anthropic
                providerName: anthropic
                model: claude-sonnet-5

    - title: Pre-provision dynamic-tier backends
      description: |
        Creates the fast/premium backends for the wizard's dynamic-tier routing step; the HTTPRoute itself is bundled by the wizard feature.
      features:
        - name: providers
          config:
            createRoute: false
            providers:
              - name: routing-dynamic-fast
                providerName: openai
                model: gpt-4o-mini
              - name: routing-dynamic-premium
                providerName: openai
                model: gpt-4o

    - title: Pre-provision the fallback backend
      description: |
        Creates the priority-grouped fallback backend for the wizard's automatic-fallback step.
      features:
        - name: providers
          config:
            pathPrefix: /chat/fallback
            name: routing-fallback
            groups:
              - providers:
                  - name: routing-fallback-cheap
                    providerName: openai
                    model: gpt-4o-mini
              - providers:
                  - name: routing-fallback-premium
                    providerName: openai
                    model: gpt-4o

    - title: Deploy LLM provider
      description: |
        Exposes an OpenAI LLM provider at /openai that the four agents route completions through.
      features:
        - name: providers
          config:
            providers:
              - name: openai
                providerName: openai
                pathPrefix: /openai

    - title: Deploy Postgres for the ops-agents token exchange service
      description: |
        Dedicated Postgres instance backing this usecase's own STS database.
      features:
        - name: postgres
          config:
            name: ops-agents-postgres

    - title: Enable the Security Token Service (STS)
      description: |
        Enables the agentgateway control plane's STS at port 7777 and its OAuth issuer (consent enabled) for the Brokered Stripe elicitation step below.
      features:
        - name: token-exchange
          config:
            subjectValidator:
              validatorType: remote
              remoteConfig:
                url: 'https://{{env.domains.core.keycloak}}/realms/agw-dev/protocol/openid-connect/certs'
              skipMayActClaimValidation: true
            apiValidator:
              validatorType: remote
              remoteConfig:
                url: 'https://{{env.domains.core.keycloak}}/realms/agw-dev/protocol/openid-connect/certs'
            tokenExpiration: 1h
            skipMayActClaimValidation: true
            callbackUrl: 'https://{{env.domains.core.agentgatewayUi}}/elicitations'
            database:
              postgres:
                url: postgres://tokenexchange:tokenexchange@ops-agents-postgres.agentgateway-system.svc.cluster.local:5432/tokenexchange?sslmode=disable
            oauthIssuerConfig:
              downstream_server:
                name: agw-dev
                client_id: agw-token-exchange
                authorize_url: 'https://{{env.domains.core.keycloak}}/realms/agw-dev/protocol/openid-connect/auth'
                token_url: 'https://{{env.domains.core.keycloak}}/realms/agw-dev/protocol/openid-connect/token'
                scopes: [openid, profile]
              gateway_config:
                base_url: 'https://{{env.domains.core.agentgateway}}/oauth-issuer'
              par_config:
                enabled: true
              consent:
                enabled: true
                platform_name: Agentgateway Demo Console

    - title: Deploy the Core Banking MCP server
      description: |
        Deploys the internal core-banking MCP (a fake ledger) at /core-banking-standard, carrying the Impersonation exchange the Accounts Agent reads through.
      features:
        - name: mcp-server
          config:
            deployServer: true
            image: '{{env.images.opsAgents.core-banking}}'
            serverName: core-banking
            serverPort: 8000
            servicePort: 80
            protocol: StreamableHTTP
            mcpPath: /mcp
            pathPrefix: /core-banking-standard
            backendName: core-banking-standard-backend
            targetName: core-banking-standard-target
            routeName: core-banking-standard

    - title: Expose a second route to the Core Banking MCP for the Delegation path
      description: |
        Second route/backend to the same pod, carrying only STS-issued Delegation tokens for the Settlement Agent's transfer calls.
      features:
        - name: mcp-server
          config:
            deployServer: false
            backendName: core-banking-delegation-backend
            targetName: core-banking-delegation-target
            routeName: core-banking-delegation
            pathPrefix: /core-banking-delegation
            targets:
              - name: core-banking-delegation-target
                host: core-banking.agentgateway-system.svc.cluster.local
                port: 80
                protocol: StreamableHTTP
                path: /mcp

    - title: Protect the standard route with the proxy-native Impersonation exchange
      description: |
        Performs the RFC 8693 Impersonation exchange (re-signed, no act claim) on the standard route before forwarding to core-banking.
      features:
        - name: oauth-token-exchange
          config:
            name: core-banking-standard-exchange
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: core-banking-standard
            jwtAuthentication:
              issuer: 'https://{{env.domains.core.keycloak}}/realms/agw-dev'
              audiences: [account]
              jwks:
                host: '{{env.domains.core.keycloak}}'
                path: realms/agw-dev/protocol/openid-connect/certs
            tokenEndpoint:
              host: '{{env.domains.core.keycloak}}'
              path: /realms/agw-dev/protocol/openid-connect/token
            clientAuth:
              clientId: agw-token-exchange

    - title: Protect the delegation route with STS-issued-token validation
      description: |
        Validates the delegation route accepts tokens from either the STS (normal chain) or Keycloak directly (raw token, used by the direct-call demo).
      features:
        - name: obo-token-exchange
          config:
            policyName: core-banking-delegation-jwt-policy
            jwtMode: Strict
            providers:
              - issuer: '{{env.internal.stsIssuer}}'
                jwksPath: /.well-known/jwks.json
                jwksBackend:
                  name: enterprise-agentgateway
                  namespace: agentgateway-system
                  port: 7777
                audiences: [agentgateway]
              - issuer: 'https://{{env.domains.core.keycloak}}/realms/agw-dev'
                audiences: [account]
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: core-banking-delegation

    - title: Pre-provision the tool-modes comparison's own chat backend
      description: |
        Creates a dedicated chat backend for the wizard's tool-modes savings comparison, independent of the Agents pillar's own /agent-chat route - that route only exists after a presenter clicks Apply on Agents step 1, and is removed by Revert/Reset.
      features:
        - name: providers
          config:
            providers:
              - name: mcp-modes-chat
                providerName: openai
                pathPrefix: /mcp-modes/chat
                model: gpt-4o-mini

    - title: Deploy the stock and currency MCP server workloads for tool-mode federation
      description: |
        Deploys the stock and currency MCP servers the four tool-mode backends below federate alongside Core Banking. This step's own AgentgatewayBackend/HTTPRoute are not used by this demo - each mcp-enterprise backend federates the same underlying Services via label selectors.
      features:
        - name: mcp-server
          config:
            backendName: mcp-modes-workloads-backend
            routeName: mcp-modes-workloads
            createRoute: false
            protocol: StreamableHTTP
            mcpPath: /mcp
            servers:
              - name: stock-server-mcp
                image: '{{env.images.common.stock-server-mcp}}'
                serverPort: 8000
                servicePort: 80
              - name: currency-server-mcp
                image: '{{env.images.common.currency-server-mcp}}'
                serverPort: 8000
                servicePort: 80
            targets:
              - name: stock-server-mcp
                matchLabels:
                  app: stock-server-mcp
              - name: currency-server-mcp
                matchLabels:
                  app: currency-server-mcp

    - title: Federate the tool-mode catalog with toolMode Standard
      description: |
        Baseline backend for the wizard's tool-modes scoreboard: Core Banking + stock + currency federated with every tool listed individually.
      features:
        - name: mcp-enterprise
          config:
            backendName: mcp-modes-standard-backend
            routeName: mcp-modes-standard
            pathPrefix: /mcp-modes/standard
            toolMode: Standard
            targets:
              - name: core-banking
                matchLabels:
                  app: core-banking
              - name: stock-server-mcp
                matchLabels:
                  app: stock-server-mcp
              - name: currency-server-mcp
                matchLabels:
                  app: currency-server-mcp

    - title: Federate the tool-mode catalog with toolMode Search
      description: |
        Same federated catalog, collapsed into get_tool/invoke_tool meta-tools for the wizard's Search mode.
      features:
        - name: mcp-enterprise
          config:
            backendName: mcp-modes-search-backend
            routeName: mcp-modes-search
            pathPrefix: /mcp-modes/search
            toolMode: Search
            targets:
              - name: core-banking
                matchLabels:
                  app: core-banking
              - name: stock-server-mcp
                matchLabels:
                  app: stock-server-mcp
              - name: currency-server-mcp
                matchLabels:
                  app: currency-server-mcp

    - title: Deploy the Accounts Agent (read-only, Impersonation)
      description: |
        Reads the customer's balances/transactions, presenting the user's token unchanged for the gateway's Impersonation exchange.
      features:
        - name: workload-agent
          config:
            agentName: accounts-agent
            image: '{{env.images.opsAgents.accounts-agent}}'
            pathPrefix: /accounts-agent
            routeName: accounts-agent
            useTokenExchange: false
            llmBaseUrl: '{{env.internal.agentgateway}}/openai'
            additionalEnv:
              - name: MCP_CORE_BANKING_URL
                value: '{{env.internal.agentgateway}}/core-banking-standard/mcp'

    - title: Deploy the Transfer Orchestrator Agent (hop 1 of the delegation chain)
      description: |
        Exchanges the user's token at the STS, then delegates the ledger operation to the Settlement Agent.
      features:
        - name: workload-agent
          config:
            agentName: transfer-orchestrator-agent
            image: '{{env.images.opsAgents.transfer-orchestrator-agent}}'
            pathPrefix: /transfer-orchestrator-agent
            routeName: transfer-orchestrator-agent
            useTokenExchange: true
            saTokenAudience: agentgateway
            llmBaseUrl: '{{env.internal.agentgateway}}/openai'
            additionalEnv:
              - name: STS_URL
                value: '{{env.internal.sts}}'
              - name: SETTLEMENT_AGENT_URL
                value: '{{env.internal.agentgateway}}/settlement-agent/run'

    - title: Deploy the Settlement Agent (hop 2, re-exchanges and surfaces the chain)
      description: |
        Re-exchanges the delegated token at the STS (nested act chain), calls the core-banking transfer tool, and reports the chain of custody.
      features:
        - name: workload-agent
          config:
            agentName: settlement-agent
            image: '{{env.images.opsAgents.settlement-agent}}'
            pathPrefix: /settlement-agent
            routeName: settlement-agent
            useTokenExchange: true
            saTokenAudience: agentgateway
            llmBaseUrl: '{{env.internal.agentgateway}}/openai'
            additionalEnv:
              - name: STS_URL
                value: '{{env.internal.sts}}'
              - name: MCP_CORE_BANKING_DELEGATION_URL
                value: '{{env.internal.agentgateway}}/core-banking-delegation/mcp'

    - title: Deploy the Statements Agent (Elicitation)
      description: |
        Reaches the Stripe sandbox on the customer's behalf; the first call with no stored credential triggers elicitation.
      features:
        - name: workload-agent
          config:
            agentName: statements-agent
            image: '{{env.images.opsAgents.statements-agent}}'
            pathPrefix: /statements-agent
            routeName: statements-agent
            useTokenExchange: false
            llmBaseUrl: '{{env.internal.agentgateway}}/openai'
            additionalEnv:
              - name: MCP_STRIPE_URL
                value: '{{env.internal.agentgateway}}/mcp-stripe-brokered'
              - name: MCP_PAYPAL_URL
                value: '{{env.internal.agentgateway}}/mcp-paypal'

    - title: Create the PayPal OAuth client secret
      description: |
        Registers a PayPal MCP OAuth client (DCR) for the Interactive elicitation path, since Stripe's OAuth app can't issue a client secret.
      features:
        - name: elicitation-secret
          config:
            secretName: ops-agents-paypal-oauth
            provider: paypal
            clientSecretEnvVar: AGW_DEMO_PAYPAL_CLIENT_SECRET

    - title: Configure the PayPal MCP backend with Interactive Elicitation
      description: |
        Points agentgateway at PayPal's sandbox MCP server with Interactive elicitation, prompting OAuth consent on first use.
      features:
        - name: elicitation-backend
          config:
            mode: interactive
            backendName: paypal-mcp-backend
            policyName: paypal-mcp-elicitation
            routeName: mcp-paypal
            pathPrefix: /mcp-paypal
            secretName: ops-agents-paypal-oauth
            provider: paypal
            clientIdEnvVar: AGW_DEMO_PAYPAL_CLIENT_ID
            authorizeUrl: https://mcp.sandbox.paypal.com/authorize
            accessTokenUrl: https://mcp.sandbox.paypal.com/token
            redirectUri: 'https://{{env.domains.core.agentgatewayUi}}/elicitations'
            upstream:
              host: mcp.sandbox.paypal.com
              port: 443
              path: /mcp
              tls: true

    - title: Configure the Stripe MCP backend with Brokered Elicitation
      description: |
        Points agentgateway at Stripe's MCP server with Brokered elicitation, brokering the upstream credential inline via the gateway's own OAuth issuer and consent screen.
      features:
        - name: elicitation-backend
          config:
            mode: brokered
            backendName: stripe-mcp-brokered-backend
            policyName: stripe-mcp-brokered
            routeName: mcp-stripe-brokered
            pathPrefix: /mcp-stripe-brokered
            upstream:
              host: mcp.stripe.com
              port: 443
              path: /
              tls: true
            brokered:
              mcpResourcePath: /mcp-stripe-brokered
              chainedAuth:
                baseUrl: https://mcp.stripe.com
                scopes: ['mcp']

    - title: Deploy the wizard
      description: |
        Deploys the wizard app: Deployment, Service, scoped RBAC, its own VPN-locked HTTPS Gateway, and the dynamic-tier HTTPRoute.
      features:
        - name: agentgateway-demo-wizard
          config:
            image: '{{env.images.wizard.agentgateway-demo-wizard}}'
            agwHost: '{{env.domains.core.agentgateway}}'
            keycloakHost: '{{env.domains.core.keycloak}}'
            hostname: '{{env.domains.app.wizard}}'
            sourceRanges: '{{env.security.vpnSourceRanges}}'
            tls:
              enabled: true

    - title: Protect the auth pillar's real-agent routes with agentgateway's own ext-auth
      description: |
        Gates the /secure prefix with agentgateway's own OAuth authorization-code flow, forwarding the token upstream as a Bearer header; other routes are untouched.
      features:
        - name: oauth-authorization-code
          config:
            authConfigName: agw-ext-auth
            policyName: agw-ext-auth
            secretName: agw-ext-auth-oauth
            issuerUrl: 'https://{{env.domains.core.keycloak}}/realms/agw-dev/'
            clientId: agw-ext-auth
            clientSecret: agw-ext-auth-secret
            appUrl: 'https://{{env.domains.app.wizard}}'
            callbackPath: /secure/oidc-callback
            logoutPath: /secure/logout
            scopes: [email]
            headers:
              accessTokenHeader: Authorization
              useBearerSchemaForAuthorization: true
            session:
              allowRefreshing: true
              preExpiryBufferSeconds: 30
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: agentgateway-demo-wizard-secure

    # Appended last: the `gateway` feature below becomes the implicit target gateway for
    # any later feature invocation without an explicit gatewayName (none of the steps
    # above use `gateway`, so they're unaffected). The providers step right after relies
    # on this default to land the shared tenant route on agentgateway-tenants, not the
    # shared gateway.
    - title: Deploy a dedicated Gateway for tenant traffic
      description: Tenant traffic gets its own Gateway so Strict JWT validation never touches the shared one.
      features:
        - name: gateway
          config:
            name: agentgateway-tenants
            listeners:
              - name: http
                port: 8080
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: All

    - title: Configure the shared tenant model route
      features:
        - name: providers
          config:
            providers:
              - name: openai
                providerName: openai
                pathPrefix: /tenants/chat
                model: gpt-4o-mini

    - title: Validate tenant identity
      features:
        - name: multi-org-jwt-auth
          config:
            gatewayName: agentgateway-tenants
            keycloakHost: '{{env.domains.core.keycloak}}'
            injectOrgHeaders: true
            orgRealms:
              - { realm: org-acme, orgId: acme }
              - { realm: org-globex, orgId: globex }
              - { realm: org-initech, orgId: initech }

    - title: Gate the shared model by tenant entitlement
      features:
        - name: cel-based-rbac
          config:
            action: Allow
            expressions:
              - "jwt.org_id in ['acme', 'globex']"
            targetRefs:
              - {
                  group: gateway.networking.k8s.io,
                  kind: HTTPRoute,
                  name: agentgateway-tenants-openai,
                }

    - title: Cap spend per tenant
      features:
        - name: budget-limits
          config:
            budgetsResourceName: tenant-budgets
            policyName: tenant-budget-enforcement
            targetRefs:
              - {
                  group: gateway.networking.k8s.io,
                  kind: HTTPRoute,
                  name: agentgateway-tenants-openai,
                }
            budgets:
              - name: acme-monthly
                subject: { org_id: acme }
                limit: { unit: Tokens, amount: 100000 }
                window: { unit: Month }
                onBudgetExceeded: Block
              - name: globex-monthly
                subject: { org_id: globex }
                limit: { unit: Tokens, amount: 1 }
                window: { unit: Month }
                onBudgetExceeded: Block

  # spec.tests below defaults to the first `gateway` feature found in steps
  # (usecase-tests.js), which is now agentgateway-tenants - any test added later for this
  # file's other steps needs an explicit gatewayName.
  tests:
    - name: acme-allowed
      description: acme is entitled to the shared tenant model and has budget - the request reaches it.
      steps:
        - action: get-token
          keycloak:
            hostname: '{{env.domains.core.keycloak}}'
            scheme: '{{env.keycloak.scheme}}'
            realm: org-acme
            clientId: acme-team-eng
            clientSecret: acme-team-eng-secret
            grantType: client_credentials
        - action: send-request
          endpoint: /tenants/chat
          auth: bearer
          model: gpt-4o-mini
          prompt: 'What is 2+2?'
        - action: verify
          expect:
            statusCode: 200

    - name: globex-budget-blocked
      description: |
        globex is entitled to the route, but its 1-token monthly budget is exceeded before the request is forwarded - independent of acme's budget on the same route.
      steps:
        - action: get-token
          keycloak:
            hostname: '{{env.domains.core.keycloak}}'
            scheme: '{{env.keycloak.scheme}}'
            realm: org-globex
            clientId: globex-team-sales
            clientSecret: globex-team-sales-secret
            grantType: client_credentials
        - action: send-request
          endpoint: /tenants/chat
          auth: bearer
          model: gpt-4o-mini
          prompt: 'Hello'
        - action: verify
          expect:
            statusCode: 429

    - name: initech-denied-403
      description: |
        initech authenticates successfully against its own org JWKS, but the deny-by-default CEL entitlement rule denies the route outright - a valid identity is not enough to reach a model the tenant isn't provisioned for.
      steps:
        - action: get-token
          keycloak:
            hostname: '{{env.domains.core.keycloak}}'
            scheme: '{{env.keycloak.scheme}}'
            realm: org-initech
            clientId: initech-team-dev
            clientSecret: initech-team-dev-secret
            grantType: client_credentials
        - action: send-request
          endpoint: /tenants/chat
          auth: bearer
          model: gpt-4o-mini
          prompt: 'Hello'
        - action: verify
          expect:
            statusCode: 403

    - name: initech-forged-header-still-403
      description: |
        initech forges the x-gw-org-id header the gateway injects, claiming to be acme. Still denied: the CEL entitlement rule reads the verified jwt.org_id claim, never the client-supplied header - the header is not a trust boundary for authorization.
      steps:
        - action: get-token
          keycloak:
            hostname: '{{env.domains.core.keycloak}}'
            scheme: '{{env.keycloak.scheme}}'
            realm: org-initech
            clientId: initech-team-dev
            clientSecret: initech-team-dev-secret
            grantType: client_credentials
        - action: send-request
          endpoint: /tenants/chat
          auth: bearer
          model: gpt-4o-mini
          prompt: 'Hello'
          headers:
            x-gw-org-id: acme
        - action: verify
          expect:
            statusCode: 403

    - name: initech-forged-header-echo-overwritten
      description: |
        Mechanical proof the gateway overwrites the forged header rather than trusting it: initech's JWT plus a forged x-gw-org-id: acme header reaches the echo backend showing x-gw-org-id=initech, the verified claim, not the forged value. GET is required - the echo route rewrites to httpbin's /headers, which only accepts GET, and URLRewrite doesn't change the original method.
      steps:
        - action: get-token
          keycloak:
            hostname: '{{env.domains.core.keycloak}}'
            scheme: '{{env.keycloak.scheme}}'
            realm: org-initech
            clientId: initech-team-dev
            clientSecret: initech-team-dev-secret
            grantType: client_credentials
        - action: send-request
          endpoint: /org-routing/echo
          method: GET
          auth: bearer
          headers:
            x-gw-org-id: acme
        - action: verify
          expect:
            statusCode: 200
            contains: initech
            notContains: acme

    - name: invalid-jwt-401
      description: Tampered JWT signature is rejected with 401 before reaching any entitlement or budget check.
      steps:
        - action: send-request
          endpoint: /tenants/chat
          method: POST
          headers:
            Authorization: Bearer eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJ0YW1wZXJlZCJ9.invalidsig
        - action: verify
          expect:
            statusCode: 401
