apiVersion: agentgateway.demo/v1
kind: UseCase
metadata:
  name: catch-all-default-model
  description: |
    Serve one specific model by exact name, and catch every other model name with a catch-all AgentgatewayModel that forwards to a real model behind the scenes.

    - Requires the experimental AgentgatewayModel CRD/API enabled (`agentgatewayModels.enabled=true` Helm value on the control plane chart, `installAgentgatewayModelCRD=true` on the CRD chart)
    - `match.model: '*'` matches any model name not claimed by a more specific AgentgatewayModel
    - A `model` transformation rewrites the client's (possibly unrecognized) name to a real OpenAI model before the request is forwarded - useful for legacy/typo'd model names
  docs: https://docs.solo.io/agentgateway/latest/llm/models/about/

spec:
  diagram: |
    flowchart LR
      Client -->|"model=gpt-4o-mini"| MG[models-gateway]
      Client -->|"model=anything-else"| MG
      MG --> Specific["AgentgatewayModel gpt-4o-mini (exact)"]
      MG --> Catch["AgentgatewayModel default-model (match=*)"]
      Specific --> OpenAI[OpenAI]
      Catch -->|rewrite -> gpt-4o-mini| OpenAI

  features:
    - name: gateway
      config:
        name: models-gateway
        listeners:
          - name: http
            port: 8080
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: All
              kinds:
                - group: gateway.networking.k8s.io
                  kind: HTTPRoute
                - group: agentgateway.dev
                  kind: AgentgatewayModel

    - name: agentgateway-model
      description: A specific exact-match model plus a catch-all fallback model
      config:
        sectionName: http
        models:
          - name: gpt-4o-mini
            provider: openai
            visibility: Public
          - name: default-model
            match: '*'
            provider: openai
            visibility: Public
            transformations:
              - field: model
                expression: '"gpt-4o-mini"'

  tests:
    - name: test-catch-all-specific-match-still-wins
      description: A request for the exact model name is served by the specific AgentgatewayModel
      steps:
        - action: send-request
          endpoint: /v1/chat/completions
          model: gpt-4o-mini
          prompt: 'What is 2+2?'
        - action: verify
          expect:
            status: success

    - name: test-catch-all-unrecognized-model-name
      description: An unrecognized model name is still served via the catch-all fallback
      steps:
        - action: send-request
          endpoint: /v1/chat/completions
          model: totally-unknown-legacy-model
          prompt: 'What is 2+2?'
        - action: verify
          expect:
            status: success
