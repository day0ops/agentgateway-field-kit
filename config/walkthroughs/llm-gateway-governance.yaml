apiVersion: agentgateway.demo/v1
kind: Walkthrough
metadata:
  name: llm-gateway-governance
  description: A tour of agentgateway's access-control and traffic-shaping capabilities for LLM traffic - identity and RBAC, budget and spend limits, prompt guardrails, token rate limiting, and a capstone screen stacking all of them - against real OpenAI and Anthropic traffic. Before starting, port-forward the gateway with `kubectl port-forward -n agentgateway-system svc/agentgateway-gw 8080:8080`. This walkthrough and llm-gateway-routing cannot both be deployed live on the same cluster - both place a policy on the shared Gateway's PreRouting phase, and whichever deploys last silently replaces the other's. Fully clean up one before running the other.

spec:
  environment: local
  credentials:
    alice:
      issuerUrl: 'https://{{env.domains.core.keycloak}}/realms/agw-dev'
      clientId: agw-client-public
  screens:
    - name: identity-and-access
      title: Identity and Access
      narration: |
        One endpoint, two gates: a Keycloak-issued JWT proves who's calling, then OpenFGA decides whether that identity is allowed to use the requested model - via org membership, team allowlists, or a direct grant. This screen also switches on Gateway-level API-key authentication that a later screen in this walkthrough uses, even though these steps only exercise the JWT path. Before running the steps below, port-forward the gateway with `kubectl port-forward -n agentgateway-system svc/agentgateway-gw 8080:8080`.
      setup:
        - name: openfga
          config:
            namespace: openfga
            image: '{{env.images.openfga.openfga-engine}}'
        - name: providers
          config:
            bodyRouting: true
            pathPrefix: /gov-chat
            providers:
              - name: openai-gpt4o
                providerName: openai
                model: gpt-4o
              - name: openai-gpt35
                providerName: openai
                model: gpt-3.5-turbo
              - name: anthropic-claude35
                providerName: anthropic
                model: claude-sonnet-5
        - name: keycloak-jwt-auth
          config:
            keycloakHost: '{{env.domains.core.keycloak}}'
            mode: Optional
            claimHeaders:
              - claim: preferred_username
                header: x-user-id
                fallback: "apiKey['user_id']"
        - name: virtual-keys
          config:
            mode: Optional
            location:
              header:
                name: X-Api-Key
            keys:
              - name: alice
                key: sk-alice-demo-abc123def456
                userId: alice
                tokenBudget: 100000
              - name: bob
                key: sk-bob-demo-xyz789uvw012
                userId: bob
                tokenBudget: 100000
              - name: team-ci
                key: sk-team-ci-demo-9f3c7a1e
                userId: team-ci
                tokenBudget: 5000
        - name: openfga-authz
          config:
            policyName: openfga-rebac-policy
            adapterImage: '{{env.images.openfga.openfga-ext-authz}}'
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: providers-gov-chat-route
      steps:
        - kind: http
          label: 'POST /gov-chat (gpt-4o, no credentials)'
          method: POST
          url: 'http://localhost:8080/gov-chat'
          body: '{"model": "gpt-4o", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 401
        - kind: http
          label: 'POST /gov-chat (gpt-4o, alice via JWT)'
          credential: alice
          method: POST
          url: 'http://localhost:8080/gov-chat'
          body: '{"model": "gpt-4o", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 200
        - kind: http
          label: 'POST /gov-chat (claude-sonnet-5, alice via JWT)'
          credential: alice
          method: POST
          url: 'http://localhost:8080/gov-chat'
          body: '{"model": "claude-sonnet-5", "messages": [{"role": "user", "content": "What is 2+2?"}]}'
          expectStatus: 403
    - name: budget-and-spend-limits
      title: Budget and Spend Limits
      narration: |
        Virtual API keys carry their own identity and token budgets - no JWT required. This screen issues alice, bob, and team-ci keys scoped to a dedicated route, then layers per-key budgets on top: bob's daily budget is exhausted by any real request and blocks with 429, alice's is also exhausted but only audits (logs) the overage and lets the request through, and a wildcard org-wide monthly ceiling acts as a catch-all safety net. Because screen 1 already switched on a Gateway-wide Optional API-key policy, these requests use X-Api-Key instead of Authorization - a present-but-malformed Authorization header would otherwise be parsed as a JWT and rejected. Before running the steps below, port-forward the gateway with `kubectl port-forward -n agentgateway-system svc/agentgateway-gw 8080:8080`.
      setup:
        - name: providers
          config:
            providers:
              - name: gov-cost-openai
                providerName: openai
                pathPrefix: /gov-cost
                model: gpt-4o-mini
        - name: virtual-keys
          config:
            mode: Optional
            location:
              header:
                name: X-Api-Key
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: gov-cost-openai
            keys:
              - name: alice
                key: sk-alice-demo-abc123def456
                userId: alice
                tokenBudget: 100000
              - name: bob
                key: sk-bob-demo-xyz789uvw012
                userId: bob
                tokenBudget: 100000
              - name: team-ci
                key: sk-team-ci-demo-9f3c7a1e
                userId: team-ci
                tokenBudget: 5000
        - name: budget-limits
          config:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: gov-cost-openai
            budgets:
              - name: bob-daily-tokens
                subject:
                  virtualKey: bob
                limit:
                  unit: Tokens
                  amount: 1
                window:
                  unit: Day
                onBudgetExceeded: Block
              - name: alice-daily-tokens
                subject:
                  virtualKey: alice
                limit:
                  unit: Tokens
                  amount: 1
                window:
                  unit: Day
                onBudgetExceeded: Audit
              - name: org-wide-monthly-ceiling
                subject:
                  virtualKey: '*'
                limit:
                  unit: Tokens
                  amount: 10000000
                window:
                  unit: Month
                onBudgetExceeded: Audit
      steps:
        - kind: http
          label: 'POST /gov-cost (bob, 1-token daily budget exceeded, Block)'
          method: POST
          url: 'http://localhost:8080/gov-cost'
          headers:
            X-Api-Key: sk-bob-demo-xyz789uvw012
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}'
          expectStatus: 429
        - kind: http
          label: 'POST /gov-cost (alice, 1-token daily budget exceeded, Audit only)'
          method: POST
          url: 'http://localhost:8080/gov-cost'
          headers:
            X-Api-Key: sk-alice-demo-abc123def456
          body: '{"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}'
          expectStatus: 200
