apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
  namespace: '{{NAMESPACE}}'
  labels:
    app: openfga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfga
  template:
    metadata:
      labels:
        app: openfga
    spec:
      containers:
        - name: openfga
          image: '{{OPENFGA_IMAGE}}'
          args: ['run', '--datastore-engine', 'memory', '--playground-enabled=false']
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            limits:
              memory: 512Mi
              cpu: '0.5'
            requests:
              memory: 256Mi
              cpu: '0.1'
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
  namespace: '{{NAMESPACE}}'
  labels:
    app: openfga
spec:
  selector:
    app: openfga
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8081
  type: ClusterIP
