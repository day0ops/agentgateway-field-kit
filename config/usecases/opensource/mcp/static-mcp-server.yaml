apiVersion: agentgateway.demo/v1
kind: UseCase
metadata:
  name: static-mcp-server
  description: |
    Route MCP traffic to a statically addressed MCP server through agentgateway, on the open-source agentgateway.dev chart.

    - AgentgatewayBackend with a fixed target host/port
    - MCP stock server workload exposed at /mcp
    - Available tools: get_stock_price, get_stock_history
    - Protocol: Streamable HTTP
  docs: https://agentgateway.dev/docs/

spec:
  edition: opensource
  diagram: |
    sequenceDiagram
      participant Agent
      participant AGW as agentgateway
      participant MCP as MCP Stock Server
      Agent->>AGW: MCP initialize
      AGW->>MCP: forward (static target)
      MCP-->>Agent: tools list
      Agent->>AGW: MCP tools/call get_stock_price
      AGW->>MCP: forward tool call
      MCP-->>Agent: stock price result
  steps:
    - title: Deploy static MCP server
      description: |
        Deploy the MCP stock server workload. Create an AgentgatewayBackend with a static MCP target. The Service uses appProtocol kgateway.dev/mcp so agentgateway speaks the MCP protocol to the upstream.
      features:
        - name: mcp-server
          config:
            deployServer: true
            image: '{{env.images.stock-server-mcp}}'
            serverName: stock-server-mcp
            serverPort: 8000
            servicePort: 80
            protocol: StreamableHTTP
            backendName: mcp-backend
            targetName: mcp-target
            routeName: mcp

  tests:
    - name: test-mcp-tools-list
      description: Verify the MCP server tools are discoverable through agentgateway
      steps:
        - action: send-mcp-request
          endpoint: /mcp
          method: tools/list
        - action: verify
          expect:
            status: success
            contains: get_stock_price

    - name: test-mcp-tool-call
      description: Call the get_stock_price tool through agentgateway
      steps:
        - action: send-mcp-request
          endpoint: /mcp
          method: tools/call
          params:
            name: get_stock_price
            arguments:
              symbol: AAPL
        - action: verify
          expect:
            status: success
