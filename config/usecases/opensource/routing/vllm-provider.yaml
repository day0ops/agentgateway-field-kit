apiVersion: agentgateway.demo/v1
kind: UseCase
metadata:
  name: vllm-provider
  description: |
    Route requests to a vLLM-compatible backend on the open-source agentgateway.dev chart. Same shape as the enterprise version (routing/vllm-provider) - vLLM serves the OpenAI chat-completions API natively, so this needs zero vLLM-specific gateway code.

    - Demo-portable: uses the vLLM community's llm-d-inference-sim (via the mock-provider feature) instead of a real vLLM server, so this runs without a GPU or model download
    - mock-provider emits the OSS AgentgatewayBackend kind on this edition - schema-verified (agentgateway.dev/v1alpha1 also supports policies.auth.passthrough), but not runtime-tested against an actual opensource-edition cluster in this repo
  docs: https://docs.solo.io/agentgateway/latest/llm/providers/vllm/

spec:
  edition: opensource
  diagram: |
    flowchart LR
      Client --> AGW[agentgateway]
      AGW --> VLLM[llm-d-inference-sim, standing in for vLLM]

  features:
    - name: mock-provider
      config:
        name: vllm-sim
        model: vllm-llama-3-8b
        pathPrefix: /vllm

  tests:
    - name: vllm-provider-greeting
      description: A chat-completions request reaches the vLLM-compatible backend and succeeds
      steps:
        - action: send-request
          endpoint: /vllm
          model: vllm-llama-3-8b
          prompt: 'Hello, how are you?'
        - action: verify
          expect:
            status: success
